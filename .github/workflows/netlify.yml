name: Netlify

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        run: npm test

      - name: Run deploy gate
        run: npm run check
        env:
          DEPLOY_GATE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || 'preview' }}
          YDP_FALLBACK_EMAIL: ${{ secrets.YDP_FALLBACK_EMAIL }}
          YDP_LINK_PRIVACY: ${{ secrets.YDP_LINK_PRIVACY }}
          YDP_LINK_TERMS: ${{ secrets.YDP_LINK_TERMS }}
          YDP_LINK_ACCESSIBILITY: ${{ secrets.YDP_LINK_ACCESSIBILITY }}

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy preview
        if: github.event_name == 'pull_request'
        id: preview
        run: |
          RESULT=$(netlify deploy \
            --dir=. \
            --alias="pr-${{ github.event.pull_request.number }}" \
            --json)
          echo "url=$(echo $RESULT | jq -r '.deploy_url')" >> $GITHUB_OUTPUT
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.preview.outputs.url }}';
            const marker = '<!-- netlify-preview -->';
            const body = `${marker}\n🌐 **Deploy preview:** ${url}\n\n*Last updated: ${context.sha.slice(0,7)}*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Deploy to production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: netlify deploy --dir=. --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
