<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Before you continue – National Community Cultural Training Programme 2025</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Flag_of_Barbados.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/govbb-tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/govbb-base.css">
</head>
<body>
<div id="chrome-top"></div>
<main><div class="container py-l max-w-3xl" id="app"></div></main>
<div id="chrome-bottom"></div>
<script src="/assets/govbb-framework.js"></script>
<script src="/assets/ydp-multipage.js"></script>
<script>
YDP.initPage({
  formName: 'National Community Cultural Training Programme 2025',
  storeKey: 'ydp_ncctp',
  pageId: 'consent',
  onBeforeNext: () => GovBB.D['consent'] === 'No, I do not wish to continue registering' ? 'no-consent.html' : null,
  nextUrl: 'personal-info.html',
  validate: () => GovBB.D['consent'] ? [] : [{id: 'consent', msg: 'Choose whether you want to continue'}],
  template: () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-4">Before you continue</h1>
      <div class="space-y-8">
        ${YDP.guardianNote()}
        <div class="bg-bb-blue-10 p-6 rounded-sm space-y-4 text-[1.25rem]">
          <p>The Ministry of Youth, Sports and Community Empowerment will use the information you give us on this form to help run, fund and evaluate their work. We may also use this information to contact you after the programme to ask about your work, education and life circumstances.</p>
          <p>By completing this form you confirm that you are willing for us to use your information in these ways. You may withdraw your consent at any time.</p>
        </div>
        ${GovBB.radioGroup('consent', 'Would you like to continue registering?', [
          'Yes, I would like to continue registering',
          'No, I do not wish to continue registering'
        ])}
        ${GovBB.continueBtn()}
      </div>
    </form>`
});
</script>
</body>
</html>
