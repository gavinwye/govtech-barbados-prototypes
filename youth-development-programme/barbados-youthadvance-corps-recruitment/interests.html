<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tell us about yourself – BYAC Recruitment Form</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Flag_of_Barbados.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/govbb-tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/govbb-base.css">
</head>
<body>
<div id="chrome-top"></div>
<main><div class="container py-l max-w-3xl" id="app"></div></main>
<div id="chrome-bottom"></div>
<script src="/assets/govbb-framework.js"></script>
<script src="/assets/ydp-multipage.js"></script>
<script>
YDP.initPage({
  formName: 'BYAC Recruitment Form',
  storeKey: 'ydp_byac',
  pageId: 'interests',
  nextUrl: 'personal-statement.html',
  validate: () => {
    const D = GovBB.D;
    const errors = [];
    if (!D['group-membership']) errors.push({ id: 'group-membership', msg: 'Group membership – Answer this question' });
    if (!D['career-goal']) errors.push({ id: 'career-goal', msg: 'Career goal – Enter your career goal' });
    if (!D['can-swim']) errors.push({ id: 'can-swim', msg: 'Swimming – Tell us if you can swim' });
    if (!D['disability']) errors.push({ id: 'disability', msg: 'Disability – Answer this question' });
    return errors;
  },
  template: () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Tell us about yourself</h1>
      <div class="space-y-8">
        <div id="error-summary"></div>
        ${GovBB.textareaField('group-membership', 'Are you a member of a youth group, community group, or sports club?', { hint: 'Give the name of the group. Write "No" if you are not a member.', rows: 3 })}
        ${GovBB.textareaField('hobbies', 'What are your hobbies, interests, or special skills?', { hint: 'Optional', rows: 3 })}
        ${GovBB.radioGroup('employed', 'Are you currently employed?', ['Yes – full time', 'Yes – part time', 'No'])}
        ${GovBB.textareaField('career-goal', 'What career would you like to pursue?', { rows: 3 })}
        ${GovBB.textField('alt-choice-1', 'Alternative career choice 1', { hint: 'Optional' })}
        ${GovBB.textField('alt-choice-2', 'Alternative career choice 2', { hint: 'Optional' })}
        ${GovBB.textField('alt-choice-3', 'Alternative career choice 3', { hint: 'Optional' })}
        ${GovBB.radioGroup('can-swim', 'Can you swim?', ['Yes', 'No'])}
        ${GovBB.textField('religion', 'Religion', { hint: 'Optional' })}
        ${GovBB.textareaField('disability', 'Do you have a disability?', { hint: 'Describe your disability, or write "None" if you do not have one.', rows: 3 })}
        <fieldset>
          <legend class="font-bold text-[1.25rem] mb-4">Clothing sizes (optional)</legend>
          <div class="space-y-4">
            ${GovBB.textField('shirt-size', 'Shirt size', { hint: 'For example, M, L, XL', width: 'w-32' })}
            ${GovBB.textField('pants-size', 'Pants size', { hint: 'For example, 32×30', width: 'w-32' })}
            ${GovBB.textField('shoe-size', 'Shoe size', { hint: 'For example, 10', width: 'w-32' })}
          </div>
        </fieldset>
        ${GovBB.continueBtn()}
      </div>
    </form>`
});
</script>
</body>
</html>
