<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parent or guardian details – BYAC Recruitment Form</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Flag_of_Barbados.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/govbb-tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/govbb-base.css">
</head>
<body>
<div id="chrome-top"></div>
<main><div class="container py-l max-w-3xl" id="app"></div></main>
<div id="chrome-bottom"></div>
<script src="/assets/govbb-framework.js"></script>
<script src="/assets/ydp-multipage.js"></script>
<script>
YDP.initPage({
  formName: 'BYAC Recruitment Form',
  storeKey: 'ydp_byac',
  pageId: 'parent-guardian',
  nextUrl: 'education.html',
  validate: () => {
    const D = GovBB.D;
    const errors = [];
    if (!D['guardian1-name']) errors.push({ id: 'guardian1-name', msg: 'Guardian 1 name – Enter a name' });
    if (!D['guardian1-address']) errors.push({ id: 'guardian1-address', msg: 'Guardian 1 address – Enter an address' });
    if (!D['guardian1-phone-home']) errors.push({ id: 'guardian1-phone-home', msg: 'Guardian 1 home phone – Enter a phone number' });
    return errors;
  },
  template: () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Parent or guardian details</h1>
      <p class="text-[1.25rem] text-bb-mid-grey-00 mb-8">Because you are under 18, we need details for at least one parent or guardian.</p>
      ${YDP.guardianNote()}
      <div class="space-y-8">
        <div id="error-summary"></div>
        <fieldset>
          <legend class="font-bold text-[1.5rem] mb-4">Parent or guardian 1</legend>
          <div class="space-y-6">
            ${GovBB.textField('guardian1-name', 'Full name')}
            ${GovBB.textField('guardian1-address', 'Address')}
            ${GovBB.telField('guardian1-phone-home', 'Home phone', { placeholder: '246-555-1234' })}
            ${GovBB.telField('guardian1-phone-work', 'Work phone', { hint: 'Optional', placeholder: '246-555-1234' })}
          </div>
        </fieldset>
        <fieldset>
          <legend class="font-bold text-[1.5rem] mb-4">Parent or guardian 2 (optional)</legend>
          <div class="space-y-6">
            ${GovBB.textField('guardian2-name', 'Full name', { hint: 'Optional' })}
            ${GovBB.textField('guardian2-address', 'Address', { hint: 'Optional' })}
            ${GovBB.telField('guardian2-phone-home', 'Home phone', { hint: 'Optional', placeholder: '246-555-1234' })}
            ${GovBB.telField('guardian2-phone-work', 'Work phone', { hint: 'Optional', placeholder: '246-555-1234' })}
          </div>
        </fieldset>
        ${GovBB.continueBtn()}
      </div>
    </form>`
});
</script>
</body>
</html>
