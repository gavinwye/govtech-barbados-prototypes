<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your personal statement – BYAC Recruitment Form</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Flag_of_Barbados.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/govbb-tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/govbb-base.css">
</head>
<body>
<div id="chrome-top"></div>
<main><div class="container py-l max-w-3xl" id="app"></div></main>
<div id="chrome-bottom"></div>
<script src="/assets/govbb-framework.js"></script>
<script src="/assets/ydp-multipage.js"></script>
<script>
YDP.initPage({
  formName: 'BYAC Recruitment Form',
  storeKey: 'ydp_byac',
  pageId: 'personal-statement',
  nextUrl: 'medical.html',
  validate: () => {
    const D = GovBB.D;
    const errors = [];
    if (!D['personal-statement']) errors.push({ id: 'personal-statement', msg: 'Personal statement – Write your personal statement' });
    return errors;
  },
  template: () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-4">Your personal statement</h1>
      <p class="text-[1.25rem] text-bb-mid-grey-00 mb-8">Tell us about yourself. Include your background, your future plans, and how the BYAC programme can help you reach your goals.</p>
      <div class="space-y-8">
        <div id="error-summary"></div>
        ${GovBB.textareaField('personal-statement', 'Personal statement', { rows: 10, maxlength: 2000 })}
        ${GovBB.continueBtn()}
      </div>
    </form>`
});
</script>
</body>
</html>
