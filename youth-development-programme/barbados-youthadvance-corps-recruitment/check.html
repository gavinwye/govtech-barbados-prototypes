<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check your answers – BYAC Recruitment Form</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Flag_of_Barbados.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/govbb-tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/govbb-base.css">
</head>
<body>
<div id="chrome-top"></div>
<main><div class="container py-l max-w-3xl" id="app"></div></main>
<div id="chrome-bottom"></div>
<script src="/assets/govbb-framework.js"></script>
<script src="/assets/ydp-multipage.js"></script>
<script>
YDP.initPage({
  formName: 'BYAC Recruitment Form',
  storeKey: 'ydp_byac',
  pageId: 'check',
  deptContactPhone: '(246) 535-0180',
  template: () => {
    const D = GovBB.D;
    const dob = [D['dob-day'], D['dob-month'], D['dob-year']].filter(Boolean).join(' / ');
    const isMinor = YDP.ageFromDob(D) !== null && YDP.ageFromDob(D) < 18;

    // Qualifications summary — collect rows from any qual-subject-N keys.
    const qualIndexes = new Set();
    Object.keys(D).forEach(k => {
      const m = k.match(/^qual-(?:subject|year|body|level|grade)-(\d+)$/);
      if (m) qualIndexes.add(parseInt(m[1], 10));
    });
    const qualRows = Array.from(qualIndexes).sort((a, b) => a - b).map(i => {
      const parts = [D[`qual-subject-${i}`], D[`qual-level-${i}`], D[`qual-grade-${i}`], D[`qual-year-${i}`], D[`qual-body-${i}`]].filter(Boolean);
      return parts.join(' · ');
    }).filter(Boolean);
    const qualsSummary = qualRows.length ? qualRows.join('<br>') : '—';

    return `
    ${GovBB.backLink()}
    <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Check your answers</h1>
    <div class="space-y-10">

      <div>
        <h2 class="font-bold text-[2rem] mb-4">Personal details</h2>
        <dl class="divide-y divide-bb-grey-00 border-t border-bb-grey-00">
          ${GovBB.summaryRow('NRN', D['nrn'], 'personal-info.html')}
          ${GovBB.summaryRow('NIN', D['nin'], 'personal-info.html')}
          ${GovBB.summaryRow('Name', [D['first-name'], D['middle-initial'], D['last-name']].filter(Boolean).join(' '), 'personal-info.html')}
          ${GovBB.summaryRow('Address', [D['address-line1'], D['address-line2'], D['parish']].filter(Boolean).join(', '), 'personal-info.html')}
          ${GovBB.summaryRow('Date of birth', dob, 'personal-info.html')}
          ${GovBB.summaryRow('Country of birth', D['country-of-birth'], 'personal-info.html')}
          ${GovBB.summaryRow('Sex', D['sex'], 'personal-info.html')}
          ${GovBB.summaryRow('Age', YDP.ageFromDob(D), 'personal-info.html')}
          ${GovBB.summaryRow('Relationship status', D['union-status'], 'personal-info.html')}
          ${GovBB.summaryRow('Children', D['num-children'] || '0', 'personal-info.html')}
        </dl>
      </div>

      ${isMinor ? `
      <div>
        <h2 class="font-bold text-[2rem] mb-4">Parent or guardian</h2>
        <dl class="divide-y divide-bb-grey-00 border-t border-bb-grey-00">
          ${GovBB.summaryRow('Guardian 1 name', D['guardian1-name'], 'parent-guardian.html')}
          ${GovBB.summaryRow('Guardian 1 address', D['guardian1-address'], 'parent-guardian.html')}
          ${GovBB.summaryRow('Guardian 1 home phone', D['guardian1-phone-home'], 'parent-guardian.html')}
          ${D['guardian2-name'] ? GovBB.summaryRow('Guardian 2 name', D['guardian2-name'], 'parent-guardian.html') : ''}
        </dl>
      </div>` : ''}

      <div>
        <h2 class="font-bold text-[2rem] mb-4">Education</h2>
        <dl class="divide-y divide-bb-grey-00 border-t border-bb-grey-00">
          ${GovBB.summaryRow('Primary school', D['primary-school'] || '—', 'education.html')}
          ${GovBB.summaryRow('Secondary school', D['secondary-school'] || '—', 'education.html')}
          ${GovBB.summaryRow('Other institution', D['other-school'] || '—', 'education.html')}
        </dl>
      </div>

      <div>
        <h2 class="font-bold text-[2rem] mb-4">Qualifications</h2>
        <dl class="divide-y divide-bb-grey-00 border-t border-bb-grey-00">
          ${GovBB.summaryRow('Qualifications', qualsSummary, 'qualifications.html')}
        </dl>
      </div>

      <div>
        <h2 class="font-bold text-[2rem] mb-4">About you</h2>
        <dl class="divide-y divide-bb-grey-00 border-t border-bb-grey-00">
          ${GovBB.summaryRow('Group membership', D['group-membership'] || '—', 'interests.html')}
          ${GovBB.summaryRow('Career goal', D['career-goal'] || '—', 'interests.html')}
          ${GovBB.summaryRow('Can swim', D['can-swim'] || '—', 'interests.html')}
          ${GovBB.summaryRow('Disability', D['disability'] || '—', 'interests.html')}
        </dl>
      </div>

      <div>
        <h2 class="font-bold text-[2rem] mb-4">Personal statement</h2>
        <dl class="divide-y divide-bb-grey-00 border-t border-bb-grey-00">
          ${GovBB.summaryRow('Statement', D['personal-statement'] || '—', 'personal-statement.html')}
        </dl>
      </div>

      <div>
        <h2 class="font-bold text-[2rem] mb-4">Health</h2>
        <dl class="divide-y divide-bb-grey-00 border-t border-bb-grey-00">
          ${GovBB.summaryRow('Rheumatic fever', D['rheumatic-fever'] || '—', 'medical.html')}
          ${GovBB.summaryRow('Asthma', D['asthma'] || '—', 'medical.html')}
          ${GovBB.summaryRow('Allergies', D['allergies'] || '—', 'medical.html')}
          ${GovBB.summaryRow('Epilepsy', D['epilepsy'] || '—', 'medical.html')}
          ${GovBB.summaryRow('Diabetes', D['diabetes'] || '—', 'medical.html')}
          ${GovBB.summaryRow('Medication allergies', D['medication-allergies'] || '—', 'medical.html')}
          ${GovBB.summaryRow('Blood type', D['blood-type'] || '—', 'medical.html')}
        </dl>
      </div>

      <div class="mt-8 flex gap-4">
        <button type="button" onclick="YDP.submit('confirmation.html')" class="${GovBB.BTN_CLS}">Submit application</button>
      </div>
    </div>`;
  }
});
</script>
</body>
</html>
