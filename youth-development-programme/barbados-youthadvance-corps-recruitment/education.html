<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your education – BYAC Recruitment Form</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Flag_of_Barbados.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/govbb-tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/govbb-base.css">
</head>
<body>
<div id="chrome-top"></div>
<main><div class="container py-l max-w-3xl" id="app"></div></main>
<div id="chrome-bottom"></div>
<script src="/assets/govbb-framework.js"></script>
<script src="/assets/ydp-multipage.js"></script>
<script>
YDP.initPage({
  formName: 'BYAC Recruitment Form',
  storeKey: 'ydp_byac',
  pageId: 'education',
  nextUrl: 'qualifications.html',
  validate: () => [],
  template: () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Your education</h1>
      <div class="space-y-8">
        <div id="error-summary"></div>
        <fieldset>
          <legend class="font-bold text-[1.5rem] mb-4">Primary school</legend>
          <div class="space-y-4">
            ${GovBB.textField('primary-school', 'Name of school', { hint: 'Optional' })}
            ${GovBB.textField('primary-from', 'Year started', { hint: 'Optional', width: 'w-28', inputmode: 'numeric' })}
            ${GovBB.textField('primary-to', 'Year finished', { hint: 'Optional', width: 'w-28', inputmode: 'numeric' })}
          </div>
        </fieldset>
        <fieldset>
          <legend class="font-bold text-[1.5rem] mb-4">Secondary school</legend>
          <div class="space-y-4">
            ${GovBB.textField('secondary-school', 'Name of school', { hint: 'Optional' })}
            ${GovBB.textField('secondary-from', 'Year started', { hint: 'Optional', width: 'w-28', inputmode: 'numeric' })}
            ${GovBB.textField('secondary-to', 'Year finished', { hint: 'Optional', width: 'w-28', inputmode: 'numeric' })}
          </div>
        </fieldset>
        <fieldset>
          <legend class="font-bold text-[1.5rem] mb-4">Other (college, university, training)</legend>
          <div class="space-y-4">
            ${GovBB.textField('other-school', 'Name of institution', { hint: 'Optional' })}
            ${GovBB.textField('other-from', 'Year started', { hint: 'Optional', width: 'w-28', inputmode: 'numeric' })}
            ${GovBB.textField('other-to', 'Year finished', { hint: 'Optional', width: 'w-28', inputmode: 'numeric' })}
          </div>
        </fieldset>
        ${GovBB.continueBtn()}
      </div>
    </form>`
});
</script>
</body>
</html>
