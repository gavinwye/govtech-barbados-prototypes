<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application submitted – BYAC Recruitment Form</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Flag_of_Barbados.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/govbb-tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/govbb-base.css">
</head>
<body>
<div id="chrome-top"></div>
<main><div class="container py-l max-w-3xl" id="app"></div></main>
<div id="chrome-bottom"></div>
<script src="/assets/govbb-framework.js"></script>
<script src="/assets/ydp-multipage.js"></script>
<script>
const STORE = 'ydp_byac';
let ref = '';
try { ref = sessionStorage.getItem(STORE + '_ref') || ''; } catch(e) {}
if (!ref) ref = 'BYAC-' + Math.random().toString(36).substring(2,8).toUpperCase();
YDP.clearAll(STORE);

YDP.initPage({
  formName: 'BYAC Recruitment Form',
  storeKey: STORE,
  pageId: 'confirmation',
  template: () => `
    <div class="space-y-8">
      <div class="bg-bb-teal-00 text-bb-white-00 p-8 rounded-sm space-y-4">
        <h1 class="font-bold text-[3.5rem] leading-[1.15]">Application submitted</h1>
        <p class="text-[1.5rem]">Your reference number</p>
        <p class="text-[2rem] font-bold">${YDP.esc(ref)}</p>
      </div>
      <h2 class="font-bold text-[2rem]">What happens next</h2>
      <p class="text-[1.25rem]">We will review your application and contact you within 10 working days.</p>
      <p class="text-[1.25rem]">If you are shortlisted, we will invite you to an interview and ask you to bring your supporting documents.</p>
      <p class="text-[1.25rem]">If you have any questions, call us on <strong>(246) 535-0180</strong> or visit us at #33 Warrens Industrial Park, St. Michael.</p>
      <div class="mt-8">
        <a href="https://alpha.gov.bb/" class="${GovBB.BTN_CLS} no-underline">Go home</a>
      </div>
    </div>`
});
</script>
</body>
</html>
