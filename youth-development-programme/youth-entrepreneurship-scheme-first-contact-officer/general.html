<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How did the client find out about YES? – YES First Contact (Officer)</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Flag_of_Barbados.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/govbb-tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/govbb-base.css">
</head>
<body>
<div id="chrome-top"></div>
<main><div class="container py-l max-w-3xl" id="app"></div></main>
<div id="chrome-bottom"></div>
<script src="/assets/govbb-framework.js"></script>
<script src="/assets/ydp-multipage.js"></script>
<script>
const HOW_HEARD = ['Youth Commissioner', 'School (secondary, SJPI, BCC, UWI)', 'Organisation', 'Press (newspaper, radio, TV)', 'An existing YES client', 'Other'];
const heardKey = h => 'heard-' + h.toLowerCase().replace(/[^a-z0-9]/g, '-');

YDP.initPage({
  formName: 'YES First Contact (Officer)',
  storeKey: 'ydp_yes_officer',
  pageId: 'general',
  nextUrl: 'check.html',
  template: () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">How did the client find out about YES?</h1>
      <div class="space-y-8">
        <div id="error-summary"></div>
        <div class="space-y-4">
          ${HOW_HEARD.map(h => GovBB.checkboxItem(heardKey(h), h)).join('')}
        </div>
        ${GovBB.continueBtn()}
      </div>
    </form>`
});
</script>
</body>
</html>
