<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client's personal details – YES First Contact (Officer)</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Flag_of_Barbados.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/govbb-tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/govbb-base.css">
</head>
<body>
<div id="chrome-top"></div>
<main><div class="container py-l max-w-3xl" id="app"></div></main>
<div id="chrome-bottom"></div>
<script src="/assets/govbb-framework.js"></script>
<script src="/assets/ydp-multipage.js"></script>
<script>
YDP.initPage({
  formName: 'YES First Contact (Officer)',
  storeKey: 'ydp_yes_officer',
  pageId: 'personal-info',
  nextUrl: 'education.html',
  validate: () => {
    const D = GovBB.D;
    const errors = [];
    if (!D['first-name']) errors.push({ id: 'first-name', msg: 'First name – Enter the client\'s first name' });
    if (!D['last-name']) errors.push({ id: 'last-name', msg: 'Last name – Enter the client\'s last name' });
    if (!D['sex']) errors.push({ id: 'sex', msg: 'Sex – Choose the client\'s sex' });
    if (!D['dob-day'] || !D['dob-month'] || !D['dob-year']) errors.push({ id: 'dob-day', msg: 'Date of birth – Enter the client\'s date of birth' });
    if (!D['national-id']) errors.push({ id: 'national-id', msg: 'National ID – Enter the client\'s national ID number' });
    if (!D['address']) errors.push({ id: 'address', msg: 'Address – Enter the client\'s address' });
    if (!D['parish']) errors.push({ id: 'parish', msg: 'Parish – Select the client\'s parish' });
    if (!D['phone']) errors.push({ id: 'phone', msg: 'Phone – Enter the client\'s phone number' });
    if (!D['contact-email']) errors.push({ id: 'contact-email', msg: 'Email – Enter the client\'s email address' });
    if (!D['country-of-birth']) errors.push({ id: 'country-of-birth', msg: 'Country of birth – Enter the client\'s country of birth' });
    if (!D['nationality']) errors.push({ id: 'nationality', msg: 'Nationality – Choose the client\'s nationality' });
    if (!D['employment-status']) errors.push({ id: 'employment-status', msg: 'Employment status – Choose the client\'s employment status' });
    if (!D['marital-status']) errors.push({ id: 'marital-status', msg: 'Marital status – Choose the client\'s marital status' });
    return errors;
  },
  template: () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Client's personal details</h1>
      <div class="space-y-8">
        <div id="error-summary"></div>
        ${GovBB.textField('first-name', 'First name')}
        ${GovBB.textField('last-name', 'Last name')}
        ${GovBB.radioGroup('sex', 'Sex', ['Male', 'Female'])}
        ${GovBB.dateField('dob', 'Date of birth', 'For example, 27 03 2007')}
        ${GovBB.textField('national-id', 'National ID number', { hint: 'On the client\'s national ID card' })}
        ${GovBB.textField('address', 'Address')}
        ${GovBB.selectField('parish', 'Parish', GovBB.PARISHES)}
        ${GovBB.telField('phone', 'Phone number (home and/or mobile)', { placeholder: '246-555-1234' })}
        ${GovBB.emailField('contact-email', 'Email address')}
        ${GovBB.textField('country-of-birth', 'Country of birth')}
        ${YDP.radioWithOther('nationality', 'Nationality', ['Barbadian', 'CARICOM national', 'European national', 'U.S. national', 'British citizen'], { otherLabel: 'Specify nationality' })}
        ${GovBB.textField('religion', 'Religion', { hint: 'Optional' })}
        ${GovBB.radioGroup('employment-status', 'Current employment status', ['Employed (full time)', 'Employed (part time)', 'Self-employed', 'Unemployed', 'In school (full time)', 'In school (part time)'])}
        ${GovBB.radioGroup('marital-status', 'Marital status', ['Single', 'Married', 'Divorced', 'Separated'])}
        ${GovBB.textField('mailing-address', 'Mailing address', { hint: 'Optional — only if different from the address above' })}
        ${GovBB.continueBtn()}
      </div>
    </form>`
});
</script>
</body>
</html>
