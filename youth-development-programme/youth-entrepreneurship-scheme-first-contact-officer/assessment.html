<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Officer assessment – YES First Contact (Officer)</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Flag_of_Barbados.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/govbb-tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/govbb-base.css">
</head>
<body>
<div id="chrome-top"></div>
<main><div class="container py-l max-w-3xl" id="app"></div></main>
<div id="chrome-bottom"></div>
<script src="/assets/govbb-framework.js"></script>
<script src="/assets/ydp-multipage.js"></script>
<script>
const ASSISTANCE_REQUESTED = ['Business counselling', 'Business training', 'Mentoring', 'Financial assistance', 'Market linkages', 'Other'];
const ASSISTANCE_RECOMMENDED = ['Business counselling', 'Business training', 'Mentoring', 'Financial assistance', 'Market linkages', 'Referral to another agency', 'Other'];
const slug = s => s.toLowerCase().replace(/[^a-z0-9]/g, '-');
const reqKey = a => 'req-' + slug(a);
const recKey = a => 'rec-' + slug(a);

YDP.initPage({
  formName: 'YES First Contact (Officer)',
  storeKey: 'ydp_yes_officer',
  pageId: 'assessment',
  nextUrl: 'medical.html',
  validate: () => {
    const D = GovBB.D;
    const errors = [];
    const anyReq = ASSISTANCE_REQUESTED.some(a => D[reqKey(a)]);
    if (!anyReq) errors.push({ id: reqKey('Business counselling'), msg: 'Assistance requested – Choose at least one option' });
    const anyRec = ASSISTANCE_RECOMMENDED.some(a => D[recKey(a)]);
    if (!anyRec) errors.push({ id: recKey('Business counselling'), msg: 'Assistance recommended – Choose at least one option' });
    if (!D['second-assessment']) errors.push({ id: 'second-assessment', msg: 'Second assessment – Choose Yes or No' });
    if (!D['eligible-training']) errors.push({ id: 'eligible-training', msg: 'Eligible for training – Choose Yes or No' });
    return errors;
  },
  template: () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Officer assessment</h1>
      <div class="space-y-8">
        <div id="error-summary"></div>
        <div>
          <p class="font-bold text-[1.25rem] mb-4">Assistance requested by client</p>
          <p class="text-[1.25rem] text-bb-mid-grey-00 mb-4">Choose all that apply.</p>
          <div class="space-y-4">
            ${ASSISTANCE_REQUESTED.map(a => GovBB.checkboxItem(reqKey(a), a)).join('')}
          </div>
        </div>
        <div data-show-when-check="${reqKey('Other')}" style="${GovBB.D[reqKey('Other')] ? '' : 'display:none;'}" class="pl-s mt-s">
          ${GovBB.textField('req-other-detail', 'Describe the assistance requested')}
        </div>
        <div>
          <p class="font-bold text-[1.25rem] mb-4">Assistance recommended by officer</p>
          <p class="text-[1.25rem] text-bb-mid-grey-00 mb-4">Choose all that apply.</p>
          <div class="space-y-4">
            ${ASSISTANCE_RECOMMENDED.map(a => GovBB.checkboxItem(recKey(a), a)).join('')}
          </div>
        </div>
        <div data-show-when-check="${recKey('Other')}" style="${GovBB.D[recKey('Other')] ? '' : 'display:none;'}" class="pl-s mt-s">
          ${GovBB.textField('rec-other-detail', 'Describe the assistance recommended')}
        </div>
        ${GovBB.radioGroup('second-assessment', 'Is a second assessment needed?', ['Yes', 'No'])}
        ${GovBB.radioGroup('eligible-training', 'Is the client eligible for entrepreneurial training?', ['Yes', 'No'])}
        ${GovBB.textareaField('assessment-comments', 'Additional comments', { hint: 'Optional — any other notes from the session', rows: 5 })}
        ${GovBB.continueBtn()}
      </div>
    </form>`
});
</script>
</body>
</html>
