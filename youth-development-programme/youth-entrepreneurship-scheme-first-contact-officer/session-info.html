<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session details – YES First Contact (Officer)</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Flag_of_Barbados.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/govbb-tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/govbb-base.css">
</head>
<body>
<div id="chrome-top"></div>
<main><div class="container py-l max-w-3xl" id="app"></div></main>
<div id="chrome-bottom"></div>
<script src="/assets/govbb-framework.js"></script>
<script src="/assets/ydp-multipage.js"></script>
<script>
YDP.initPage({
  formName: 'YES First Contact (Officer)',
  storeKey: 'ydp_yes_officer',
  pageId: 'session-info',
  nextUrl: 'personal-info.html',
  validate: () => {
    const D = GovBB.D;
    const errors = [];
    if (!D['contact-date-day'] || !D['contact-date-month'] || !D['contact-date-year']) errors.push({ id: 'contact-date-day', msg: 'Date of contact – Enter the date of contact' });
    if (!D['officer-name']) errors.push({ id: 'officer-name', msg: 'Officer name – Enter your name' });
    return errors;
  },
  template: () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Session details</h1>
      <div class="space-y-8">
        <div id="error-summary"></div>
        ${GovBB.dateField('contact-date', 'Date of contact', 'For example, 23 04 2026')}
        ${GovBB.textField('client-file-number', 'Client file number', { hint: 'The reference number from the client\'s paper file' })}
        ${GovBB.textField('session-duration', 'Duration of session', { hint: 'For example, 45 minutes', width: 'w-48' })}
        ${GovBB.textField('officer-name', 'Your name (keying in officer)', { hint: 'The name of the officer completing this record' })}
        ${GovBB.continueBtn()}
      </div>
    </form>`
});
</script>
</body>
</html>
