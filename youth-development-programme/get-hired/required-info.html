<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Required information – Get Hired Programme 2026</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Flag_of_Barbados.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/govbb-tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/govbb-base.css">
</head>
<body>
<div id="chrome-top"></div>
<main><div class="container py-l max-w-3xl" id="app"></div></main>
<div id="chrome-bottom"></div>
<script src="/assets/govbb-framework.js"></script>
<script src="/assets/ydp-multipage.js"></script>
<script>
YDP.initPage({
  formName: 'Get Hired Programme 2026',
  storeKey: 'ydp_get_hired',
  pageId: 'required-info',
  nextUrl: 'socio-economic.html',
  validate: () => {
    const errs = [];
    const D = GovBB.D;
    if (!D['nrn']) errs.push({id:'nrn', msg:'Enter your National Registration Number'});
    if (!D['has-tamis']) errs.push({id:'has-tamis', msg:'Tell us if you have a TAMIS Number'});
    if (!D['has-nis']) errs.push({id:'has-nis', msg:'Tell us if you have an NIS number'});
    if (!D['has-bank']) errs.push({id:'has-bank', msg:'Tell us if you have a bank account'});
    return errs;
  },
  template: () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-4">Required information</h1>
      <p class="text-[1.25rem] text-bb-mid-grey-00 mb-8">You must have all of these when the programme starts.</p>
      <div class="space-y-8">
        ${GovBB.textField('nrn', 'National Registration Number', { hint: 'This is on your national ID card. For example, 870315-1234' })}
        ${GovBB.radioGroup('has-tamis', 'Do you have a TAMIS Number?', ['Yes','No'])}
        ${GovBB.radioGroup('has-nis', 'Do you have a National Insurance (NIS) Number?', ['Yes','No'])}
        ${GovBB.radioGroup('has-bank', 'Do you have an active bank or credit union account?', ['Yes','No'])}
        ${GovBB.continueBtn()}
      </div>
    </form>`
});
</script>
</body>
</html>
