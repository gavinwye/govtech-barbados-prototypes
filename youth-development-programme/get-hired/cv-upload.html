<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload your CV – Get Hired Programme 2026</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Flag_of_Barbados.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/govbb-tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/govbb-base.css">
</head>
<body>
<div id="chrome-top"></div>
<main><div class="container py-l max-w-3xl" id="app"></div></main>
<div id="chrome-bottom"></div>
<script src="/assets/govbb-framework.js"></script>
<script src="/assets/ydp-multipage.js"></script>
<script>
var MAX_BYTES = 5 * 1024 * 1024;
var ALLOWED_EXT = ['pdf', 'doc', 'docx', 'odt', 'rtf', 'txt'];

function handleCv(input) {
  var f = input.files && input.files[0];
  if (!f) {
    GovBB.D['cv-filename'] = '';
    GovBB.D['cv-file-type'] = '';
    YDP.saveData();
    YDP.deleteFile();
    return;
  }
  var ext = (f.name.split('.').pop() || '').toLowerCase();
  if (ALLOWED_EXT.indexOf(ext) === -1) {
    GovBB.showErrors([{ id: 'cv', msg: 'Choose a PDF, Word, ODT, RTF or TXT file.' }]);
    input.value = '';
    return;
  }
  if (f.size > MAX_BYTES) {
    GovBB.showErrors([{ id: 'cv', msg: 'File is too large (max 5 MB).' }]);
    input.value = '';
    return;
  }
  GovBB.clearErrors();
  GovBB.D['cv-filename'] = f.name;
  GovBB.D['cv-file-type'] = f.type || 'application/octet-stream';
  // Drop any legacy base64 left over from the previous storage scheme.
  delete GovBB.D['cv-file-base64'];
  YDP.saveData();
  YDP.putFile(f);
}

YDP.initPage({
  formId: 'ydp-get-hired',
  formName: 'Get Hired Programme 2026',
  storeKey: 'ydp_get_hired',
  pageId: 'cv-upload',
  nextUrl: 'publicity-consent.html',
  validate: function () {
    if (!GovBB.D['cv-filename']) return [{ id: 'cv', msg: 'Choose a file to upload' }];
    return [];
  },
  template: function () {
    var prev = GovBB.D['cv-filename'] || '';
    var note = prev ? '<p class="text-[1rem] text-bb-mid-grey-00 mt-xs">You uploaded: <span class="font-semibold">' + YDP.esc(prev) + '</span>. Choose a new file to replace it.</p>' : '';
    return '' +
    '<form novalidate>' +
      GovBB.backLink() +
      GovBB.caption() +
      '<h1 class="font-bold text-[3.5rem] leading-[1.15] mb-4">Upload your CV</h1>' +
      '<p class="text-[1.25rem] text-bb-mid-grey-00 mb-8">We need a copy of your curriculum vitae (CV).</p>' +
      '<div class="space-y-8">' +
        '<div class="field-group flex flex-col gap-xs w-full items-start">' +
          '<label for="cv" class="block text-[1.25rem] leading-normal font-bold text-bb-black-00">Your CV file</label>' +
          '<p class="text-[1.25rem] leading-normal text-bb-mid-grey-00">PDF, Word, ODT, RTF or plain text. Maximum 5 MB.</p>' +
          '<input type="file" id="cv" name="cv" class="text-[1.125rem] py-s" accept=".pdf,.doc,.docx,.odt,.rtf,.txt" onchange="handleCv(this)">' +
          note +
        '</div>' +
        GovBB.continueBtn() +
      '</div>' +
    '</form>';
  }
});
</script>
</body>
</html>
