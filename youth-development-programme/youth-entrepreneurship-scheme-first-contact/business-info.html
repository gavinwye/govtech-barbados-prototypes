<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About your business – YES First Contact</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Flag_of_Barbados.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/govbb-tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/govbb-base.css">
</head>
<body>
<div id="chrome-top"></div>
<main><div class="container py-l max-w-3xl" id="app"></div></main>
<div id="chrome-bottom"></div>
<script src="/assets/govbb-framework.js"></script>
<script src="/assets/ydp-multipage.js"></script>
<script>
YDP.initPage({
  formName: 'YES First Contact',
  storeKey: 'ydp_yes',
  pageId: 'business-info',
  nextUrl: 'business-details.html',
  validate: () => {
    const D = GovBB.D;
    return D['business-description'] ? [] : [{ id: 'business-description', msg: 'Business description – Describe your business idea' }];
  },
  template: () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">About your business</h1>
      <div class="space-y-8">
        <div id="error-summary"></div>
        ${GovBB.textField('business-name', 'Business name', { hint: 'Optional — if you do not have a name yet, leave blank' })}
        ${GovBB.textField('business-location', 'Business location or address', { hint: 'Optional' })}
        ${GovBB.telField('business-phone', 'Business phone number', { hint: 'Optional', placeholder: '246-555-1234' })}
        ${GovBB.emailField('business-email', 'Business email address', { hint: 'Optional' })}
        ${GovBB.textField('business-instagram', 'Instagram handle', { hint: 'Optional. For example, @mybusiness' })}
        ${GovBB.textField('business-facebook', 'Facebook page', { hint: 'Optional' })}
        ${GovBB.textField('business-website', 'Website', { hint: 'Optional' })}
        ${GovBB.textareaField('products-services', 'What products or services do you sell?', { hint: 'Optional — briefly describe what your business sells', rows: 3 })}
        ${GovBB.textareaField('business-description', 'Describe your business idea or business', { rows: 5 })}
        ${GovBB.continueBtn()}
      </div>
    </form>`
});
</script>
</body>
</html>
