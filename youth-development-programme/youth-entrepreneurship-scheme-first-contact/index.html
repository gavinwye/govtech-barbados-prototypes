<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply for the Youth Entrepreneurship Scheme – Division of Youth Affairs</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Flag_of_Barbados.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/govbb-tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/govbb-base.css">
</head>
<body>
<div id="chrome-top"></div>
<main><div class="container py-l max-w-3xl" id="app"></div></main>
<div id="chrome-bottom"></div>
<script src="/assets/govbb-framework.js"></script>
<script src="/assets/ydp-multipage.js"></script>
<script>
YDP.initPage({
  formName: 'YES First Contact',
  storeKey: 'ydp_yes',
  pageId: 'start',
  nextUrl: 'personal-info.html',
  template: () => `
    <div class="space-y-8">
      <a href="../../index.html" class="inline-flex items-center gap-xs outline-none underline-offset-2 underline hover:no-underline active:bg-bb-yellow-100 focus-visible:bg-bb-yellow-100 text-bb-teal-00 hover:text-bb-black-00 hover:bg-bb-teal-10">← Back</a>
      <div>
        <h1 class="font-bold text-[3.5rem] leading-[1.15]">Apply for the Youth Entrepreneurship Scheme</h1>
        <p class="text-bb-mid-grey-00 mt-2">Division of Youth Affairs, Prime Minister's Office</p>
      </div>
      <p>The YES programme supports young people who want to start or grow a business. We offer counselling, training, mentoring, and help with funding.</p>
      <div>
        <h2 class="font-bold text-[2rem] mb-4">What you will need</h2>
        <ul class="list-disc pl-6 space-y-2">
          <li>Your personal and contact details</li>
          <li>Information about your business idea or existing business</li>
          <li>Your highest qualification</li>
          <li>Contact details for an emergency contact</li>
        </ul>
      </div>
      <p>It takes about 15 minutes to complete this form.</p>
      ${GovBB.startBtn('Start now')}
    </div>`
});
</script>
</body>
</html>
