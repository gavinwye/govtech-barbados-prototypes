<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How you heard about Pathways – Pathways Employability Programme 2026</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Flag_of_Barbados.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/govbb-tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/govbb-base.css">
</head>
<body>
<div id="chrome-top"></div>
<main><div class="container py-l max-w-3xl" id="app"></div></main>
<div id="chrome-bottom"></div>
<script src="/assets/govbb-framework.js"></script>
<script src="/assets/ydp-multipage.js"></script>
<script>
YDP.initPage({
  formName: 'Pathways Employability Programme 2026',
  storeKey: 'ydp_pep',
  pageId: 'how-heard',
  nextUrl: 'publicity-consent.html',
  validate: () => {
    const errors = [];
    if (!GovBB.D['how-heard']) errors.push({ id: 'how-heard', msg: 'How you heard – Choose how you found out about Pathways' });
    return errors;
  },
  template: () => {
    const showOther = GovBB.D['how-heard'] === 'other';
    return `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">How did you hear about Pathways?</h1>
      <div class="space-y-8">
        <div id="error-summary"></div>
        ${GovBB.radioGroup('how-heard', 'How did you find out about the programme?', [
          'Division of Youth Affairs website',
          'Division of Youth Affairs Facebook',
          'Division of Youth Affairs Instagram',
          'Youth Commissioner or Ministry staff',
          'Advertisement (radio or TV)',
          'Brochure or flyer',
          'Email',
          'A family member',
          'A friend',
          { value: 'other', label: 'Other' }
        ])}
        <div data-show-when-name="how-heard" data-show-when-value="other" style="${showOther ? '' : 'display:none;'}" class="pl-s">
          ${GovBB.textField('how-heard-other-detail', 'How did you hear about it?')}
        </div>
        ${GovBB.continueBtn()}
      </div>
    </form>`;
  }
});
</script>
</body>
</html>
