<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your work experience – Pathways Employability Programme 2026</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Flag_of_Barbados.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/govbb-tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/govbb-base.css">
</head>
<body>
<div id="chrome-top"></div>
<main><div class="container py-l max-w-3xl" id="app"></div></main>
<div id="chrome-bottom"></div>
<script src="/assets/govbb-framework.js"></script>
<script src="/assets/ydp-multipage.js"></script>
<script>
YDP.initPage({
  formName: 'Pathways Employability Programme 2026',
  storeKey: 'ydp_pep',
  pageId: 'employment-history',
  nextUrl: 'job-interests.html',
  validate: () => {
    const errors = [];
    if (!GovBB.D['employment-history']) errors.push({ id: 'employment-history', msg: 'Work experience – Enter your work history, or write "None"' });
    return errors;
  },
  template: () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-4">What work experience do you have?</h1>
      <p class="text-[1.25rem] text-bb-mid-grey-00 mb-8">List each job on a new line. Include the job title, employer, and the dates you worked there. Write "None" if you have no work experience.</p>
      <div class="space-y-8">
        <div id="error-summary"></div>
        ${GovBB.textareaField('employment-history', 'Your work experience', {
          hint: 'For example: Chef – Hilton Resort Barbados – April 2019 to April 2021',
          rows: 8
        })}
        ${GovBB.continueBtn()}
      </div>
    </form>`
});
</script>
</body>
</html>
