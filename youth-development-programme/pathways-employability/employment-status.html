<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your current situation – Pathways Employability Programme 2026</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Flag_of_Barbados.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/govbb-tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/govbb-base.css">
</head>
<body>
<div id="chrome-top"></div>
<main><div class="container py-l max-w-3xl" id="app"></div></main>
<div id="chrome-bottom"></div>
<script src="/assets/govbb-framework.js"></script>
<script src="/assets/ydp-multipage.js"></script>
<script>
const EMPLOYMENT_OPTIONS = [
  'Employed (full time)', 'Employed (part time)', 'Self-employed',
  'Unemployed', 'In school (full time)', 'In school (part time)', 'Other'
];
const empSlug = o => (typeof o === 'string' ? o : o.value).toLowerCase().replace(/[^a-z0-9]/g, '-');
const empId = o => 'emp-' + empSlug(o);

YDP.initPage({
  formName: 'Pathways Employability Programme 2026',
  storeKey: 'ydp_pep',
  pageId: 'employment-status',
  nextUrl: 'marital-religion.html',
  validate: () => {
    const D = GovBB.D;
    const errors = [];
    const anySelected = EMPLOYMENT_OPTIONS.some(o => D[empId(o)]);
    if (!anySelected) errors.push({ id: empId('Employed (full time)'), msg: 'Current situation – Choose at least one option' });
    return errors;
  },
  template: () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-4">What is your current situation?</h1>
      <p class="text-[1.25rem] text-bb-mid-grey-00 mb-8">Choose all that apply.</p>
      <div class="space-y-8">
        <div id="error-summary"></div>
        <div class="space-y-4">
          ${EMPLOYMENT_OPTIONS.map(o => GovBB.checkboxItem(empId(o), typeof o === 'string' ? o : o.label)).join('')}
        </div>
        <div data-show-when-check="${empId('Other')}" style="${GovBB.D[empId('Other')] ? '' : 'display:none;'}" class="pl-s">
          ${GovBB.textField('emp-other-detail', 'Describe your current situation')}
        </div>
        ${GovBB.continueBtn()}
      </div>
    </form>`
});
</script>
</body>
</html>
