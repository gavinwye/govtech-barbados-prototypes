<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photos and publicity – Pathways Employability Programme 2026</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Flag_of_Barbados.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/govbb-tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/govbb-base.css">
</head>
<body>
<div id="chrome-top"></div>
<main><div class="container py-l max-w-3xl" id="app"></div></main>
<div id="chrome-bottom"></div>
<script src="/assets/govbb-framework.js"></script>
<script src="/assets/ydp-multipage.js"></script>
<script>
YDP.initPage({
  formName: 'Pathways Employability Programme 2026',
  storeKey: 'ydp_pep',
  pageId: 'publicity-consent',
  nextUrl: 'check.html',
  validate: () => {
    const D = GovBB.D;
    const errors = [];
    if (!D['publicity-consent']) errors.push({ id: 'publicity-consent', msg: 'Publicity consent – Choose Yes or No' });
    if (!D['data-protection-confirm']) errors.push({ id: 'data-protection-confirm', msg: 'Data protection – You must confirm this to continue' });
    return errors;
  },
  template: () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-4">Photos and publicity</h1>
      <div class="space-y-8">
        <div id="error-summary"></div>
        <div class="bg-bb-blue-10 p-6 rounded-sm space-y-4 text-[1.25rem]">
          <p>During the programme, we may take photos or videos of participants. These might be used:</p>
          <ul class="list-disc pl-6 space-y-1">
            <li>in printed materials and social media</li>
            <li>in media (newspaper, TV)</li>
            <li>in marketing and campaigns</li>
          </ul>
          <p>We will always contact you before using your image in a campaign. Photos may be used for up to 3 years.</p>
          <p>You can change your mind at any time by contacting us.</p>
        </div>
        ${GovBB.radioGroup('publicity-consent', 'Do you give consent for your photos or videos to be used?', [
          { value: 'yes', label: 'Yes, I give consent' },
          { value: 'no', label: 'No, I do not give consent' }
        ])}
        ${GovBB.checkboxItem('data-protection-confirm', 'I understand my right to ask to see any information held about me by the Division of Youth Affairs.')}
        ${GovBB.continueBtn()}
      </div>
    </form>`
});
</script>
</body>
</html>
