<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your health – Pathways Employability Programme 2026</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Flag_of_Barbados.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/govbb-tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/govbb-base.css">
</head>
<body>
<div id="chrome-top"></div>
<main><div class="container py-l max-w-3xl" id="app"></div></main>
<div id="chrome-bottom"></div>
<script src="/assets/govbb-framework.js"></script>
<script src="/assets/ydp-multipage.js"></script>
<script>
const MEDICAL_CONDITIONS = [
  'Asthma', 'Epilepsy', 'Hypertension', 'Diabetes', 'Allergies',
  'Physical disability', 'Learning disability', 'Behavioural challenges',
  'Mental health challenges', 'None', 'Other'
];
const medSlug = c => c.toLowerCase().replace(/[^a-z0-9]/g, '-');
const medId = c => 'med-' + medSlug(c);

YDP.initPage({
  formName: 'Pathways Employability Programme 2026',
  storeKey: 'ydp_pep',
  pageId: 'medical',
  nextUrl: 'emergency-contact.html',
  validate: () => {
    const D = GovBB.D;
    const errors = [];
    const anySelected = MEDICAL_CONDITIONS.some(c => D[medId(c)]);
    if (!anySelected) errors.push({ id: medId('Asthma'), msg: 'Health – Choose at least one option, or choose "None"' });
    return errors;
  },
  template: () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-4">Your health</h1>
      <p class="text-[1.25rem] text-bb-mid-grey-00 mb-8">This information is private. It helps us support you during the programme. Only authorised staff will see it. Choose all that apply.</p>
      <div class="space-y-8">
        <div id="error-summary"></div>
        <div class="space-y-4">
          ${MEDICAL_CONDITIONS.map(c => GovBB.checkboxItem(medId(c), c)).join('')}
        </div>
        <div data-show-when-check="${medId('Other')}" style="${GovBB.D[medId('Other')] ? '' : 'display:none;'}" class="pl-s">
          ${GovBB.textField('med-other-detail', 'Describe your other condition')}
        </div>
        <div id="medication-wrap" style="${MEDICAL_CONDITIONS.filter(c => c !== 'None').some(c => GovBB.D[medId(c)]) ? '' : 'display:none;'}">
          ${GovBB.textareaField('medication', 'What medication do you take, if any?', { hint: 'Optional — leave blank if none', rows: 3 })}
        </div>
        ${GovBB.continueBtn()}
      </div>
    </form>`
});

// Keep the medication textarea visible whenever any non-None condition is checked.
document.addEventListener('click', function(e) {
  const btn = e.target.closest('[role="checkbox"]');
  if (!btn || !btn.id || !btn.id.startsWith('med-')) return;
  setTimeout(function() {
    const wrap = document.getElementById('medication-wrap');
    if (!wrap) return;
    const any = MEDICAL_CONDITIONS.filter(c => c !== 'None').some(c => GovBB.D[medId(c)]);
    wrap.style.display = any ? '' : 'none';
  }, 30);
});
</script>
</body>
</html>
