<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Before you continue – Pathways Employability Programme 2026</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Flag_of_Barbados.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/govbb-tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/govbb-base.css">
</head>
<body>
<div id="chrome-top"></div>
<main><div class="container py-l max-w-3xl" id="app"></div></main>
<div id="chrome-bottom"></div>
<script src="/assets/govbb-framework.js"></script>
<script src="/assets/ydp-multipage.js"></script>
<script>
YDP.initPage({
  formName: 'Pathways Employability Programme 2026',
  storeKey: 'ydp_pep',
  pageId: 'consent',
  nextUrl: 'name.html',
  onBeforeNext: () => GovBB.D['consent'] === 'no' ? 'no-consent.html' : null,
  validate: () => {
    const errors = [];
    if (!GovBB.D['consent']) errors.push({ id: 'consent', msg: 'Consent – Choose whether you would like to continue' });
    return errors;
  },
  template: () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-4">Before you continue</h1>
      <div class="space-y-8">
        <div id="error-summary"></div>
        <div class="bg-bb-blue-10 p-6 rounded-sm space-y-4 text-[1.25rem]">
          <p>The Division of Youth Affairs will use the information you give us to:</p>
          <ul class="list-disc pl-6 space-y-1">
            <li>run, fund, and improve our programmes</li>
            <li>contact you after the programme about work, education, or life circumstances</li>
          </ul>
          <p>You can ask us to stop using your information at any time.</p>
        </div>
        ${GovBB.radioGroup('consent', 'Would you like to continue applying?', [
          { value: 'yes', label: 'Yes, I would like to continue' },
          { value: 'no', label: 'No, I do not want to continue' }
        ])}
        ${GovBB.continueBtn()}
      </div>
    </form>`
});
</script>
</body>
</html>
