<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community groups – Digital Media Programme 2026</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Flag_of_Barbados.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/govbb-tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/govbb-base.css">
</head>
<body>
<div id="chrome-top"></div>
<main><div class="container py-l max-w-3xl" id="app"></div></main>
<div id="chrome-bottom"></div>
<script src="/assets/govbb-framework.js"></script>
<script src="/assets/ydp-multipage.js"></script>
<script>
YDP.initPage({
  formName: 'Digital Media Programme 2026',
  storeKey: 'ydp_dmp',
  pageId: 'community-group',
  nextUrl: 'declaration.html',
  validate: () => {
    const D = GovBB.D;
    const errors = [];
    if (!D['community-group']) errors.push({ id: 'community-group', msg: 'Community group – Choose Yes or No' });
    if (D['community-group'] === 'Yes' && !D['group-name']) {
      errors.push({ id: 'group-name', msg: 'Group name – Enter the group name' });
    }
    return errors;
  },
  template: () => {
    const shown = GovBB.D['community-group'] === 'Yes' ? '' : 'display:none;';
    return `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Community groups</h1>
      <div class="space-y-8">
        <div id="error-summary"></div>
        ${GovBB.radioGroup('community-group', 'Are you a member of any group, club, or association?', ['Yes', 'No'])}
        <div data-show-when-name="community-group" data-show-when-value="Yes" style="${shown}" class="space-y-6 border-l-4 border-bb-blue-40 pl-s">
          ${GovBB.textField('group-name', 'Name of group, club, or association')}
          ${GovBB.textField('group-address', 'Address')}
          ${GovBB.textField('group-contact-name', 'Contact person')}
          ${GovBB.telField('group-contact-phone', 'Contact phone number', { placeholder: '246-555-1234' })}
        </div>
        ${GovBB.continueBtn()}
      </div>
    </form>`;
  }
});
</script>
</body>
</html>
