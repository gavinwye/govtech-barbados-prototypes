<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your employment status – Digital Media Programme 2026</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Flag_of_Barbados.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/govbb-tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/govbb-base.css">
</head>
<body>
<div id="chrome-top"></div>
<main><div class="container py-l max-w-3xl" id="app"></div></main>
<div id="chrome-bottom"></div>
<script src="/assets/govbb-framework.js"></script>
<script src="/assets/ydp-multipage.js"></script>
<script>
const NEEDS_INSTITUTION = ['Employed (full time)', 'Employed (part time)', 'Self-employed', 'In school (full time)', 'In school (part time)'];

YDP.initPage({
  formName: 'Digital Media Programme 2026',
  storeKey: 'ydp_dmp',
  pageId: 'employment-status',
  nextUrl: 'qualifications.html',
  validate: () => {
    const D = GovBB.D;
    const errors = [];
    if (!D['employment-status']) errors.push({ id: 'employment-status', msg: 'Employment status – Choose your employment status' });
    if (NEEDS_INSTITUTION.includes(D['employment-status']) && !D['institution-name']) {
      errors.push({ id: 'institution-name', msg: 'Institution – Enter your school or workplace name' });
    }
    return errors;
  },
  template: () => {
    const shown = NEEDS_INSTITUTION.includes(GovBB.D['employment-status']) ? '' : 'display:none;';
    return `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Your employment status</h1>
      <div class="space-y-8">
        <div id="error-summary"></div>
        ${GovBB.radioGroup('employment-status', 'Which of these describes you best?', [
          'Employed (full time)',
          'Employed (part time)',
          'Self-employed',
          'In school (full time)',
          'In school (part time)',
          'Unemployed'
        ])}
        <div data-show-when-name="employment-status" data-show-when-not="Unemployed" style="${shown}" class="pl-s">
          ${GovBB.textField('institution-name', 'Name of school, college, or workplace')}
        </div>
        ${GovBB.continueBtn()}
      </div>
    </form>`;
  }
});
</script>
</body>
</html>
