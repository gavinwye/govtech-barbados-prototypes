<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your personal details – Digital Media Programme 2026</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Flag_of_Barbados.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/govbb-tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/govbb-base.css">
</head>
<body>
<div id="chrome-top"></div>
<main><div class="container py-l max-w-3xl" id="app"></div></main>
<div id="chrome-bottom"></div>
<script src="/assets/govbb-framework.js"></script>
<script src="/assets/ydp-multipage.js"></script>
<script>
YDP.initPage({
  formName: 'Digital Media Programme 2026',
  storeKey: 'ydp_dmp',
  pageId: 'personal-info',
  nextUrl: 'employment-status.html',
  validate: () => {
    const D = GovBB.D;
    const errors = [];
    if (!D['first-name']) errors.push({ id: 'first-name', msg: 'First name – Enter your first name' });
    if (!D['last-name']) errors.push({ id: 'last-name', msg: 'Last name – Enter your last name' });
    if (!D['gender']) errors.push({ id: 'gender', msg: 'Gender – Choose your gender' });
    if (!D['address']) errors.push({ id: 'address', msg: 'Address – Enter your address' });
    if (!D['parish']) errors.push({ id: 'parish', msg: 'Parish – Select your parish' });
    if (!D['phone-mobile']) errors.push({ id: 'phone-mobile', msg: 'Mobile phone – Enter your mobile number' });
    if (!D['contact-email']) errors.push({ id: 'contact-email', msg: 'Email – Enter your email address' });
    if (!D['national-id']) errors.push({ id: 'national-id', msg: 'National ID – Enter your national ID number' });
    if (!D['dob-day'] || !D['dob-month'] || !D['dob-year']) errors.push({ id: 'dob-day', msg: 'Date of birth – Enter your date of birth' });
    if (!D['country-of-birth']) errors.push({ id: 'country-of-birth', msg: 'Country of birth – Enter your country of birth' });
    if (!D['nationality']) errors.push({ id: 'nationality', msg: 'Nationality – Enter your nationality' });
    return errors;
  },
  template: () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Your personal details</h1>
      <div class="space-y-8">
        <div id="error-summary"></div>
        ${GovBB.textField('first-name', 'First name')}
        ${GovBB.textField('last-name', 'Last name')}
        ${GovBB.radioGroup('gender', 'Gender', ['Female', 'Male', 'Prefer not to say'])}
        ${GovBB.textField('address', 'Address')}
        ${GovBB.selectField('parish', 'Parish', GovBB.PARISHES)}
        ${GovBB.telField('phone-home', 'Home phone', { hint: 'Optional', placeholder: '246-555-1234' })}
        ${GovBB.telField('phone-mobile', 'Mobile phone', { placeholder: '246-555-1234' })}
        ${GovBB.emailField('contact-email', 'Email address')}
        ${GovBB.textField('national-id', 'National ID number', { hint: 'This is on your national ID card' })}
        ${GovBB.dateField('dob', 'Date of birth', 'For example, 27 03 2007')}
        ${GovBB.textField('country-of-birth', 'Country of birth')}
        ${GovBB.textField('nationality', 'Nationality', { hint: 'For example, Barbadian, Jamaican' })}
        ${GovBB.textField('religion', 'Religion', { hint: 'Optional' })}
        ${GovBB.continueBtn()}
      </div>
    </form>`
});
</script>
</body>
</html>
