<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course information – Youth Achieving Results (Performing Arts)</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Flag_of_Barbados.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/govbb-tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/govbb-base.css">
</head>
<body>
<div id="chrome-top"></div>
<main><div class="container py-l max-w-3xl" id="app"></div></main>
<div id="chrome-bottom"></div>
<script src="/assets/govbb-framework.js"></script>
<script src="/assets/ydp-multipage.js"></script>
<script>
YDP.initPage({
  formName: 'Youth Achieving Results (Performing Arts)',
  storeKey: 'ydp_yar_pa',
  pageId: 'course-info',
  nextUrl: 'medical.html',
  validate: () => {
    const errs = [];
    if (YDP.collectChecks('disciplines').length === 0) errs.push({id:'disciplines__Dance', msg:'Choose at least one area'});
    if (!GovBB.D['has-experience']) errs.push({id:'has-experience', msg:'Tell us if you have experience'});
    return errs;
  },
  template: () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-4">Course information</h1>
      <p class="text-[1.25rem] text-bb-mid-grey-00 mb-8">Everyone on the programme takes part in music and voice training, dance, drama, technical theatre and personal development. Tell us which areas you want to specialise in.</p>
      <div class="space-y-8">
        ${YDP.checkboxGroup('disciplines', 'Areas you would like to specialise in', ['Dance','Voice Training','Drama','Drumming','Steel Pan'], { hint: 'Choose all that apply.' })}
        ${GovBB.radioGroup('has-experience', 'Do you have any experience in the areas you chose?', ['Yes','No'], { hint: 'If no, choose No and continue.' })}
        ${YDP.revealWhen('has-experience', 'Yes',
          YDP.radioWithOther('experience-level', 'What is your level of experience?', ['Beginner','Intermediate','Advanced','Expert (Professional)']) +
          GovBB.textField('experience-years', 'How many years of experience do you have?', { width: '10rem' }) +
          GovBB.textareaField('experience-location', 'Where did you receive your training?', { rows: 3 })
        )}
        ${GovBB.continueBtn()}
      </div>
    </form>`
});
</script>
</body>
</html>
