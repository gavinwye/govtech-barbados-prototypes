<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration submitted – Youth Achieving Results (Performing Arts)</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Flag_of_Barbados.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/govbb-tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/govbb-base.css">
</head>
<body>
<div id="chrome-top"></div>
<main><div class="container py-l max-w-3xl" id="app"></div></main>
<div id="chrome-bottom"></div>
<script src="/assets/govbb-framework.js"></script>
<script src="/assets/ydp-multipage.js"></script>
<script>
const STORE = 'ydp_yar_pa';
let ref = '';
try { ref = sessionStorage.getItem(STORE + '_ref') || ''; } catch(e) {}
if (!ref) ref = 'YARPA-' + Math.random().toString(36).substring(2,8).toUpperCase();
try {
  sessionStorage.removeItem(STORE);
  sessionStorage.removeItem(STORE + '_ref');
} catch(e) {}

YDP.initPage({
  formName: 'Youth Achieving Results (Performing Arts)',
  storeKey: STORE,
  pageId: 'confirmation',
  template: () => `
    <div class="space-y-8">
      <div class="bg-bb-teal-00 text-bb-white-00 p-8 rounded-sm space-y-4">
        <h1 class="font-bold text-[3.5rem] leading-[1.15]">Registration submitted</h1>
        <p class="text-[1.5rem]">Your reference number</p>
        <p class="text-[2rem] font-bold">${YDP.esc(ref)}</p>
      </div>
      <h2 class="font-bold text-[2rem]">What happens next</h2>
      <p class="text-[1.25rem]">We have sent a confirmation to your email address. The Division of Youth Affairs will review your registration and contact you within 10 working days.</p>
      <p class="text-[1.25rem]">If you have a question, email <a href="mailto:youth@barbados.gov.bb" class="${GovBB.LINK_CLS}">youth@barbados.gov.bb</a>.</p>
      <div class="mt-8">
        <a href="../../index.html" class="${GovBB.BTN_CLS} no-underline">Back to all forms</a>
      </div>
    </div>`
});
</script>
</body>
</html>
