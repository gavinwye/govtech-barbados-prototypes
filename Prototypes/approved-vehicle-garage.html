<script src="../assets/govbb-framework.js"></script>
<script>
const FORM_NAME = 'Apply to Be an Approved Vehicle Garage';

const FLOW = ['start','business-details','owner-details','garage-details','declaration','check','confirmation'];

const PAGES = {
  'start': () => `
    <div class="space-y-8">
      <h1 class="font-bold text-[3.5rem] leading-[1.15]">Apply to Be an Approved Vehicle Garage</h1>
      <p class="text-[1.25rem]">Use this service to apply for your garage to be approved by the Barbados Licensing Authority. Approved garages can carry out vehicle inspections and repairs that meet BLA standards.</p>
      <div class="space-y-4">
        <h2 class="font-bold text-[1.5rem]">What you will need</h2>
        <ul class="list-disc pl-6 space-y-2 text-[1.25rem]">
          <li>Your business name, address, and registration number</li>
          <li>The owner's name and National Registration Number</li>
          <li>Details about your garage: type of work, number of bays, and number of mechanics</li>
          <li>How many years your garage has been in operation</li>
        </ul>
      </div>
      <p class="text-[1.25rem] text-bb-mid-grey-00">It should take about 10 minutes to complete this form.</p>
      ${GovBB.startBtn()}
    </div>`,

  'business-details': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Business details</h1>
      <div class="space-y-8">
        ${GovBB.textField('business-name','Business name')}
        ${GovBB.textField('business-reg-number','Business registration number')}
        ${GovBB.textField('business-address','Business address')}
        ${GovBB.telField('business-telephone','Business telephone number',{hint:'For example, 246-555-1234',placeholder:'246-555-1234'})}
        ${GovBB.emailField('business-email','Business email address')}
        ${GovBB.continueBtn()}
      </div>
    </form>`,

  'owner-details': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Owner details</h1>
      <div class="space-y-8">
        ${GovBB.textField('owner-name','Owner full name')}
        ${GovBB.textField('owner-nrn','Owner National Registration Number',{hint:'Find this on your national ID card. Format: YYMMDD-XXXX',placeholder:'870315-1234'})}
        ${GovBB.continueBtn()}
      </div>
    </form>`,

  'garage-details': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Garage details</h1>
      <div class="space-y-8">
        ${GovBB.radioGroup('garage-type','What type of work does your garage do?',['Mechanical repairs','Body work','Electrical','Tyre service','Other'])}
        ${GovBB.textField('number-of-bays','How many service bays does your garage have?',{inputmode:'numeric',hint:'Enter a number. For example, 4'})}
        ${GovBB.textField('number-of-mechanics','How many mechanics work at your garage?',{inputmode:'numeric',hint:'Enter a number. For example, 6'})}
        ${GovBB.textField('years-in-operation','How many years has your garage been in operation?',{inputmode:'numeric',hint:'Enter a number. For example, 10'})}
        ${GovBB.continueBtn()}
      </div>
    </form>`,

  'declaration': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Declaration</h1>
      <div class="space-y-8">
        <p class="text-[1.25rem]">I declare that the information I have given is true and complete to the best of my knowledge. I understand that the BLA may inspect my garage before granting approval.</p>
        ${GovBB.checkboxItem('declaration-agree','I confirm that the information I have given is true and complete.')}
        ${GovBB.continueBtn('Submit application')}
      </div>
    </form>`,

  'check': () => `
    <div>
      ${GovBB.backLink()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Check your answers before sending your application</h1>
      <div class="space-y-8">
        <h2 class="font-bold text-[1.5rem]">Business details</h2>
        <dl>
          ${GovBB.summaryRow('Business name', GovBB.D['business-name'], 'business-details')}
          ${GovBB.summaryRow('Registration number', GovBB.D['business-reg-number'], 'business-details')}
          ${GovBB.summaryRow('Business address', GovBB.D['business-address'], 'business-details')}
          ${GovBB.summaryRow('Telephone', GovBB.D['business-telephone'], 'business-details')}
          ${GovBB.summaryRow('Email', GovBB.D['business-email'], 'business-details')}
        </dl>
        <h2 class="font-bold text-[1.5rem]">Owner details</h2>
        <dl>
          ${GovBB.summaryRow('Owner name', GovBB.D['owner-name'], 'owner-details')}
          ${GovBB.summaryRow('Owner NRN', GovBB.D['owner-nrn'], 'owner-details')}
        </dl>
        <h2 class="font-bold text-[1.5rem]">Garage details</h2>
        <dl>
          ${GovBB.summaryRow('Type of work', GovBB.D['garage-type'], 'garage-details')}
          ${GovBB.summaryRow('Number of bays', GovBB.D['number-of-bays'], 'garage-details')}
          ${GovBB.summaryRow('Number of mechanics', GovBB.D['number-of-mechanics'], 'garage-details')}
          ${GovBB.summaryRow('Years in operation', GovBB.D['years-in-operation'], 'garage-details')}
        </dl>
        ${GovBB.continueBtn('Submit application')}
      </div>
    </div>`,

  'confirmation': () => `
    <div class="space-y-8">
      <div class="confirmation-panel">
        <h1 class="font-bold text-[2rem] leading-[1.15] mb-4">Application submitted</h1>
        <p class="text-[1.25rem]">Your reference number</p>
        <p class="text-[2rem] font-bold">${window.__refNumber || 'AVG-' + Math.random().toString(36).substring(2,8).toUpperCase()}</p>
      </div>
      <h2 class="font-bold text-[1.5rem]">What happens next</h2>
      <p class="text-[1.25rem]">We got your application. The Barbados Licensing Authority will review it and may schedule an inspection of your garage.</p>
      <p class="text-[1.25rem]">If your garage meets the BLA standards, you will receive your approval certificate.</p>
    </div>`
};

function validate(pageId) {
  const D = GovBB.D;
  const errors = [];
  if (pageId === 'business-details') {
    if (!D['business-name']) errors.push({id:'business-name', msg:'Enter the business name'});
    if (!D['business-reg-number']) errors.push({id:'business-reg-number', msg:'Enter the business registration number'});
    if (!D['business-address']) errors.push({id:'business-address', msg:'Enter the business address'});
    if (!D['business-telephone']) errors.push({id:'business-telephone', msg:'Enter the business telephone number'});
    if (!D['business-email']) errors.push({id:'business-email', msg:'Enter the business email address'});
  }
  if (pageId === 'owner-details') {
    if (!D['owner-name']) errors.push({id:'owner-name', msg:'Enter the owner name'});
    if (!D['owner-nrn']) errors.push({id:'owner-nrn', msg:'Enter the owner National Registration Number'});
  }
  if (pageId === 'garage-details') {
    if (!D['garage-type']) errors.push({id:'garage-type', msg:'Select the type of work your garage does'});
    if (!D['number-of-bays']) errors.push({id:'number-of-bays', msg:'Enter the number of service bays'});
    if (!D['number-of-mechanics']) errors.push({id:'number-of-mechanics', msg:'Enter the number of mechanics'});
    if (!D['years-in-operation']) errors.push({id:'years-in-operation', msg:'Enter the number of years in operation'});
  }
  if (pageId === 'declaration') {
    if (!D['declaration-agree']) errors.push({id:'declaration-agree', msg:'You must confirm the declaration to continue'});
  }
  return errors;
}

GovBB.init({
  formName: FORM_NAME,
  flow: FLOW,
  pages: PAGES,
  validate: validate
});
</script>
