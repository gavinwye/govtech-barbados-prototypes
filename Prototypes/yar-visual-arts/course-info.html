<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course information – Youth Achieving Results (Visual Arts)</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Flag_of_Barbados.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/govbb-tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/govbb-base.css">
</head>
<body>
<div id="chrome-top"></div>
<main><div class="container py-l max-w-3xl" id="app"></div></main>
<div id="chrome-bottom"></div>
<script src="/assets/govbb-framework.js"></script>
<script src="/assets/ydp-multipage.js"></script>
<script>
YDP.initPage({
  formName: 'Youth Achieving Results (Visual Arts)',
  storeKey: 'ydp_yar_va',
  pageId: 'course-info',
  nextUrl: 'medical.html',
  validate: () => {
    const errs = [];
    if (YDP.collectChecks('programmes').length === 0) errs.push({id:'programmes__Leathercraft', msg:'Choose at least one programme'});
    if (!GovBB.D['has-experience']) errs.push({id:'has-experience', msg:'Tell us if you have experience'});
    return errs;
  },
  template: () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-4">Course information</h1>
      <p class="text-[1.25rem] text-bb-mid-grey-00 mb-8">Personal Development is compulsory for everyone. Some classes may not run if too few people sign up.</p>
      <div class="space-y-8">
        ${YDP.checkboxGroup('programmes', 'Six-month programmes you are interested in', ['Leathercraft','Jewellery Making','Pottery & Ceramics','Drawing and Painting','Garment Construction'], { hint: 'Choose all that apply.' })}
        ${GovBB.radioGroup('has-experience', 'Do you have any experience in the areas you chose?', ['Yes','No'], { hint: 'If no, choose No and continue.' })}
        ${YDP.revealWhen('has-experience', 'Yes',
          YDP.radioWithOther('experience-level', 'What is your level of experience?', ['Beginner','Intermediate','Advanced','Expert (Professional)']) +
          GovBB.textField('experience-years', 'How many years of experience do you have?', { width: '10rem' }) +
          YDP.radioWithOther('training-location', 'Where did you receive training?', ['Home','School','Organisation'])
        )}
        ${GovBB.continueBtn()}
      </div>
    </form>`
});
</script>
</body>
</html>
