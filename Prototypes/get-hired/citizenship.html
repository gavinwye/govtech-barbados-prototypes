<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citizenship and right to work – Get Hired Programme 2026</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Flag_of_Barbados.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/govbb-tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/govbb-base.css">
</head>
<body>
<div id="chrome-top"></div>
<main><div class="container py-l max-w-3xl" id="app"></div></main>
<div id="chrome-bottom"></div>
<script src="/assets/govbb-framework.js"></script>
<script src="/assets/ydp-multipage.js"></script>
<script>
YDP.initPage({
  formName: 'Get Hired Programme 2026',
  storeKey: 'ydp_get_hired',
  pageId: 'citizenship',
  nextUrl: 'required-info.html',
  validate: () => {
    const errs = [];
    const D = GovBB.D;
    if (!D['country-of-birth']) errs.push({id:'country-of-birth', msg:'Enter your country of birth'});
    if (!D['nationality']) errs.push({id:'nationality', msg:'Choose your nationality'});
    if (!D['right-to-work']) errs.push({id:'right-to-work', msg:'Tell us if you have the right to work'});
    return errs;
  },
  template: () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Citizenship and right to work</h1>
      <div class="space-y-8">
        ${GovBB.textField('country-of-birth', 'Country of birth')}
        ${YDP.radioWithOther('nationality', 'Nationality', ['Barbadian','CARICOM National','European National','U.S. National','British Citizen'])}
        ${YDP.radioWithOther('right-to-work', 'Do you have the legal right to work in Barbados?', ['Yes','No','Unsure'])}
        ${GovBB.continueBtn()}
      </div>
    </form>`
});
</script>
</body>
</html>
