  <div class="container py-l max-w-3xl" id="app"></div>

<footer class="bg-bb-blue-100 text-bb-white-00">

        <a href="#" class="underline underline-offset-2 hover:no-underline text-bb-white-00">Privacy</a>
        <a href="#" class="underline underline-offset-2 hover:no-underline text-bb-white-00">Terms</a>
        <a href="#" class="underline underline-offset-2 hover:no-underline text-bb-white-00">Accessibility</a>
      </div>
    </div>
  </div>
</footer>

<script src="../assets/govbb-framework.js"></script>
<script>
const FORM_NAME = 'Apply to Import a Vehicle into Barbados';

const FLOW = ['start','applicant-details','vehicle-config','vehicle-details','declaration','check','confirmation'];

const PAGES = {
  'start': () => `
    <div class="space-y-8">
      <h1 class="font-bold text-[3.5rem] leading-[1.15]">${FORM_NAME}</h1>
      <p class="text-[1.25rem]">Use this service to apply to the Barbados Licensing Authority (BLA) to import a vehicle into Barbados.</p>
      <p class="text-[1.25rem]">You must get approval before shipping or bringing a vehicle into the country.</p>
      <div class="space-y-4">
        <h2 class="font-bold text-[1.5rem]">What you will need</h2>
        <ul class="list-disc pl-6 space-y-2 text-[1.25rem]">
          <li>Your name or company name and contact details</li>
          <li>The make, model and colour of the vehicle</li>
          <li>The chassis number</li>
          <li>The engine number or motor number (if you have it)</li>
          <li>The date the vehicle was made</li>
          <li>Whether the vehicle is left-hand or right-hand drive</li>
          <li>The fuel type and how you plan to use the vehicle</li>
        </ul>
      </div>
      <p class="text-[1.25rem] text-bb-mid-grey-00">It should take about 10 minutes to complete this form.</p>
      ${GovBB.startBtn()}
    </div>`,

  'applicant-details': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Your details</h1>
      <div class="space-y-8">
        ${GovBB.textField('app-name','Full name or company name',{hint:'If you are applying on behalf of a company, enter the company name.'})}
        ${GovBB.textField('app-address','Address')}
        ${GovBB.telField('app-telephone','Telephone number',{hint:'For example, 246-555-1234',placeholder:'246-555-1234'})}
        ${GovBB.emailField('app-email','Email address',{hint:'We will send your confirmation to this email address.'})}
        ${GovBB.continueBtn()}
      </div>
    </form>`,

  'vehicle-config': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Vehicle configuration</h1>
      <div class="space-y-8">
        ${GovBB.radioGroup('driveType','What type of steering does the vehicle have?',['Left-hand drive','Right-hand drive'])}
        ${GovBB.radioGroup('fuelType','What fuel does the vehicle use?',['Petrol','Diesel','Electric','Hybrid','CNG','LPG'])}
        ${GovBB.radioGroup('intendedUse','How do you plan to use the vehicle?',['Private use','Commercial use','Public service vehicle'])}
        ${GovBB.continueBtn()}
      </div>
    </form>`,

  'vehicle-details': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Vehicle details</h1>
      <div class="space-y-8">
        ${GovBB.textField('iov-make','Make of vehicle',{hint:'For example, Toyota, Honda, Ford'})}
        ${GovBB.textField('iov-model','Model of vehicle',{hint:'For example, Corolla, Civic, Ranger'})}
        ${GovBB.dateField('iov','Date vehicle was made','For example, 01 06 2020')}
        ${GovBB.textField('iov-colour','Colour of vehicle')}
        ${GovBB.textField('iov-chassis','Chassis number',{hint:'You can find this on the vehicle identification plate or registration documents.'})}
        ${GovBB.textField('iov-engine','Engine number (optional)',{hint:'If the vehicle has a combustion engine, enter the engine number.'})}
        ${GovBB.textField('iov-motor','Motor number (optional)',{hint:'If the vehicle is electric or hybrid, enter the motor number.'})}
        ${GovBB.continueBtn()}
      </div>
    </form>`,

  'declaration': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Declaration</h1>
      <div class="space-y-8">
        <div class="space-y-2 mb-6">
          <p class="text-[1.25rem]"><span class="font-bold">Applicant:</span> ${GovBB.D['app-name'] || '\u2014'}</p>
          <p class="text-[1.25rem]"><span class="font-bold">Date:</span> ${(function(){ var d=new Date(); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); })()}</p>
        </div>
        <p class="text-[1.25rem]">I declare that the information I have given is true and correct. I understand that giving false information may result in my application being refused.</p>
        ${GovBB.checkboxItem('declaration-agree','I confirm that the information I have given is true and complete.')}
        <div class="mt-8 flex gap-4">
          <button type="button" onclick="back()" class="relative inline-flex items-center justify-center gap-2 text-[20px] whitespace-nowrap transition-colors duration-200 outline-none bg-bb-grey-00 text-bb-black-00 hover:bg-[#c5ccd4] px-xm py-s rounded-sm leading-[1.7] focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-offset-1 focus-visible:ring-bb-teal-100">Back</button>
          <button type="button" onclick="next()" class="relative inline-flex items-center justify-center gap-2 text-[20px] whitespace-nowrap transition-[background-color,box-shadow] duration-200 outline-none bg-bb-teal-00 text-bb-white-00 hover:bg-[#1a777d] hover:shadow-[inset_0_0_0_4px_rgba(222,245,246,0.10)] active:bg-[#0a4549] active:shadow-[inset_0_0_0_3px_rgba(0,0,0,0.20)] px-xm py-s rounded-sm leading-[1.7] focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-offset-1 focus-visible:ring-bb-teal-100">Submit application</button>
        </div>
      </div>
    </form>`,

  'check': () => `
    <div>
      ${GovBB.backLink()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Check your answers before sending your application</h1>
      <div class="space-y-8">
        <h2 class="font-bold text-[1.5rem]">Your details</h2>
        <dl>
          ${GovBB.summaryRow('Name or company','app-name' in GovBB.D ? GovBB.D['app-name'] : '','applicant-details')}
          ${GovBB.summaryRow('Address',GovBB.D['app-address'],'applicant-details')}
          ${GovBB.summaryRow('Telephone',GovBB.D['app-telephone'],'applicant-details')}
          ${GovBB.summaryRow('Email',GovBB.D['app-email'],'applicant-details')}
        </dl>
        <h2 class="font-bold text-[1.5rem]">Vehicle configuration</h2>
        <dl>
          ${GovBB.summaryRow('Steering',GovBB.D['driveType'],'vehicle-config')}
          ${GovBB.summaryRow('Fuel type',GovBB.D['fuelType'],'vehicle-config')}
          ${GovBB.summaryRow('Intended use',GovBB.D['intendedUse'],'vehicle-config')}
        </dl>
        <h2 class="font-bold text-[1.5rem]">Vehicle details</h2>
        <dl>
          ${GovBB.summaryRow('Make',GovBB.D['iov-make'],'vehicle-details')}
          ${GovBB.summaryRow('Model',GovBB.D['iov-model'],'vehicle-details')}
          ${GovBB.summaryRow('Date made',[GovBB.D['iov-day'],GovBB.D['iov-month'],GovBB.D['iov-year']].filter(Boolean).join(' / '),'vehicle-details')}
          ${GovBB.summaryRow('Colour',GovBB.D['iov-colour'],'vehicle-details')}
          ${GovBB.summaryRow('Chassis number',GovBB.D['iov-chassis'],'vehicle-details')}
          ${GovBB.D['iov-engine'] ? GovBB.summaryRow('Engine number',GovBB.D['iov-engine'],'vehicle-details') : ''}
          ${GovBB.D['iov-motor'] ? GovBB.summaryRow('Motor number',GovBB.D['iov-motor'],'vehicle-details') : ''}
        </dl>
        ${GovBB.continueBtn('Submit application')}
      </div>
    </div>`,

  'confirmation': () => `
    <div class="space-y-8">
      <div class="confirmation-panel">
        <h1 class="font-bold text-[2rem] leading-[1.15] mb-4">Application submitted</h1>
        <p class="text-[1.25rem]">Your reference number</p>
        <p class="text-[2rem] font-bold">${window.__refNumber || 'IOV-' + Math.random().toString(36).substring(2,8).toUpperCase()}</p>
      </div>
      <h2 class="font-bold text-[1.5rem]">What happens next</h2>
      <p class="text-[1.25rem]">We got your application. The Barbados Licensing Authority will review it and contact you if they need more information.</p>
      <p class="text-[1.25rem]">You should hear back within 10 working days.</p>
      <h2 class="font-bold text-[1.5rem]">Contact the Barbados Licensing Authority</h2>
      <p class="text-[1.25rem]">Phone: (246) 426-3981</p>
      <p class="text-[1.25rem]">Address: Pine East-West Boulevard, The Pine, St. Michael, Barbados</p>
    </div>`
};

function validate(pageId) {
  const D = GovBB.D;
  const errors = [];

  if (pageId === 'applicant-details') {
    if (!D['app-name'])      errors.push({id:'app-name',      msg:'Enter your full name or company name'});
    if (!D['app-address'])   errors.push({id:'app-address',   msg:'Enter your address'});
    if (!D['app-telephone']) errors.push({id:'app-telephone', msg:'Enter your telephone number'});
    if (!D['app-email'])     errors.push({id:'app-email',     msg:'Enter your email address'});
  }

  if (pageId === 'vehicle-config') {
    if (!D['driveType'])   errors.push({id:'driveType',   msg:'Select the type of steering'});
    if (!D['fuelType'])    errors.push({id:'fuelType',    msg:'Select the fuel type'});
    if (!D['intendedUse']) errors.push({id:'intendedUse', msg:'Select how you plan to use the vehicle'});
  }

  if (pageId === 'vehicle-details') {
    if (!D['iov-make'])    errors.push({id:'iov-make',    msg:'Enter the make of the vehicle'});
    if (!D['iov-model'])   errors.push({id:'iov-model',   msg:'Enter the model of the vehicle'});
    if (!D['iov-colour'])  errors.push({id:'iov-colour',  msg:'Enter the colour of the vehicle'});
    if (!D['iov-chassis']) errors.push({id:'iov-chassis', msg:'Enter the chassis number'});
  }

  if (pageId === 'declaration') {
    if (!D['declaration-agree']) errors.push({id:'declaration-agree', msg:'Declaration \u2013 You must confirm the declaration to continue'});
  }

  return errors;
}

GovBB.init({
  formName: FORM_NAME,
  flow: FLOW,
  pages: PAGES,
  validate: validate
});
</script>
</body>
</html>
