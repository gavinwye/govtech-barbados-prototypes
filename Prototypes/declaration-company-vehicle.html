<script src="../assets/govbb-framework.js"></script>
<script>
const FORM_NAME = 'Declaration Form – Company Vehicle Registration for Private Use';

const FLOW = ['start','authorised-person','business-details','vehicle-details','declaration','check','confirmation'];

const PAGES = {
  'start': () => `
    <div class="space-y-8">
      <h1 class="font-bold text-[3.5rem] leading-[1.15]">${FORM_NAME}</h1>
      <p class="text-[1.25rem]">Use this form to declare a company vehicle for private use. You must register the vehicle with the Barbados Licensing Authority (BLA) before it can be used privately.</p>
      <div class="space-y-4">
        <h2 class="font-bold text-[1.5rem]">What you will need</h2>
        <ul class="list-disc pl-6 space-y-2 text-[1.25rem]">
          <li>The name and details of the person authorised to sign for the company</li>
          <li>Your business name, type, address, and registration number</li>
          <li>Your business telephone number and email address</li>
          <li>Details about the vehicle, including the make, chassis number, and engine number</li>
        </ul>
      </div>
      <p class="text-[1.25rem] text-bb-mid-grey-00">It should take about 10 minutes to complete this form.</p>
      ${GovBB.startBtn()}
    </div>`,

  'authorised-person': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Who is the authorised person?</h1>
      <div class="space-y-8">
        ${GovBB.textField('auth-name','Full name',{hint:'Enter the name of the person authorised to sign on behalf of the company.'})}
        ${GovBB.continueBtn()}
      </div>
    </form>`,

  'business-details': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Business details</h1>
      <div class="space-y-8">
        ${GovBB.textField('biz-name','Business name')}
        ${GovBB.textField('biz-type','Business type',{hint:'For example, LLC, Inc, Partnership'})}
        ${GovBB.textField('biz-address','Business address')}
        ${GovBB.telField('biz-telephone','Business telephone number',{hint:'For example, 246-555-1234',placeholder:'246-555-1234'})}
        ${GovBB.emailField('biz-email','Business email address',{hint:'We will use this to contact you about your declaration.'})}
        ${GovBB.textField('biz-reg-num','Business registration number',{hint:'You can find this on your certificate of incorporation or business registration documents.'})}
        ${GovBB.continueBtn()}
      </div>
    </form>`,

  'vehicle-details': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Vehicle details</h1>
      <div class="space-y-8">
        ${GovBB.dateField('decl-veh','Date of vehicle declaration','For example, 15 04 2026')}
        ${GovBB.textField('decl-veh-make','Make of vehicle',{hint:'For example, Toyota, Honda, Nissan'})}
        ${GovBB.textField('decl-veh-desc','Description of vehicle',{hint:'For example, white 4-door sedan'})}
        ${GovBB.textField('decl-veh-chassis','Chassis number')}
        ${GovBB.textField('decl-veh-engine','Engine number')}
        ${GovBB.textField('decl-veh-seats','Number of seats',{inputmode:'numeric',width:'8rem'})}
        ${GovBB.continueBtn()}
      </div>
    </form>`,

  'declaration': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Declaration</h1>
      <div class="space-y-8">
        <div class="space-y-2 mb-6">
          <p class="text-[1.25rem]"><span class="font-bold">Authorised person:</span> ${GovBB.D['auth-name'] || '—'}</p>
          <p class="text-[1.25rem]"><span class="font-bold">Business:</span> ${GovBB.D['biz-name'] || '—'}</p>
          <p class="text-[1.25rem]"><span class="font-bold">Date:</span> ${(function(){ var d=new Date(); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); })()}</p>
        </div>
        <p class="text-[1.25rem]">I declare that the vehicle described in this form is owned by the above-named company and will be used for private purposes. The information I have given is true to the best of my knowledge and belief.</p>
        ${GovBB.checkboxItem('declaration-agree', 'I confirm that the information I have given is true and complete to the best of my knowledge.')}
        ${GovBB.continueBtn('Continue')}
      </div>
    </form>`,

  'check': () => `
    <div>
      ${GovBB.backLink()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Check your answers before sending your declaration</h1>
      <div class="space-y-8">
        <h2 class="font-bold text-[1.5rem]">Authorised person</h2>
        <dl>
          ${GovBB.summaryRow('Full name', GovBB.D['auth-name'], 'authorised-person')}
        </dl>
        <h2 class="font-bold text-[1.5rem]">Business details</h2>
        <dl>
          ${GovBB.summaryRow('Business name', GovBB.D['biz-name'], 'business-details')}
          ${GovBB.summaryRow('Business type', GovBB.D['biz-type'], 'business-details')}
          ${GovBB.summaryRow('Business address', GovBB.D['biz-address'], 'business-details')}
          ${GovBB.summaryRow('Business telephone', GovBB.D['biz-telephone'], 'business-details')}
          ${GovBB.summaryRow('Business email', GovBB.D['biz-email'], 'business-details')}
          ${GovBB.summaryRow('Registration number', GovBB.D['biz-reg-num'], 'business-details')}
        </dl>
        <h2 class="font-bold text-[1.5rem]">Vehicle details</h2>
        <dl>
          ${GovBB.summaryRow('Date of declaration', [GovBB.D['decl-veh-day'],GovBB.D['decl-veh-month'],GovBB.D['decl-veh-year']].filter(Boolean).join(' / '), 'vehicle-details')}
          ${GovBB.summaryRow('Make of vehicle', GovBB.D['decl-veh-make'], 'vehicle-details')}
          ${GovBB.summaryRow('Description of vehicle', GovBB.D['decl-veh-desc'], 'vehicle-details')}
          ${GovBB.summaryRow('Chassis number', GovBB.D['decl-veh-chassis'], 'vehicle-details')}
          ${GovBB.summaryRow('Engine number', GovBB.D['decl-veh-engine'], 'vehicle-details')}
          ${GovBB.summaryRow('Number of seats', GovBB.D['decl-veh-seats'], 'vehicle-details')}
        </dl>
        ${GovBB.continueBtn('Submit declaration')}
      </div>
    </div>`,

  'confirmation': () => `
    <div class="space-y-8">
      <div class="confirmation-panel">
        <h1 class="font-bold text-[2rem] leading-[1.15] mb-4">Declaration submitted</h1>
        <p class="text-[1.25rem]">Your reference number</p>
        <p class="text-[2rem] font-bold">${window.__refNumber || 'DC-' + Math.random().toString(36).substring(2,8).toUpperCase()}</p>
      </div>
      <h2 class="font-bold text-[1.5rem]">What happens next</h2>
      <p class="text-[1.25rem]">We got your declaration. The Barbados Licensing Authority will review it and may contact you if they need more information.</p>
      <p class="text-[1.25rem]">You should hear back within 5 working days.</p>
      <h2 class="font-bold text-[1.5rem]">Contact BLA</h2>
      <p class="text-[1.25rem]">Phone: (246) 426-3981</p>
      <p class="text-[1.25rem]">Address: Pine East-West Boulevard, The Pine, St. Michael, Barbados</p>
    </div>`
};

function validate(pageId) {
  const D = GovBB.D;
  const errors = [];

  if (pageId === 'authorised-person') {
    if (!D['auth-name']) errors.push({id:'auth-name', msg:'Enter the full name of the authorised person'});
  }

  if (pageId === 'business-details') {
    if (!D['biz-name'])      errors.push({id:'biz-name',      msg:'Enter the business name'});
    if (!D['biz-type'])      errors.push({id:'biz-type',      msg:'Enter the business type'});
    if (!D['biz-address'])   errors.push({id:'biz-address',   msg:'Enter the business address'});
    if (!D['biz-telephone']) errors.push({id:'biz-telephone', msg:'Enter the business telephone number'});
    if (!D['biz-email'])     errors.push({id:'biz-email',     msg:'Enter the business email address'});
    if (!D['biz-reg-num'])   errors.push({id:'biz-reg-num',   msg:'Enter the business registration number'});
  }

  if (pageId === 'vehicle-details') {
    if (!D['decl-veh-day'] || !D['decl-veh-month'] || !D['decl-veh-year'])
      errors.push({id:'decl-veh-day', msg:'Date of declaration – Enter a valid date'});
    if (!D['decl-veh-make'])    errors.push({id:'decl-veh-make',    msg:'Enter the make of the vehicle'});
    if (!D['decl-veh-desc'])    errors.push({id:'decl-veh-desc',    msg:'Enter a description of the vehicle'});
    if (!D['decl-veh-chassis']) errors.push({id:'decl-veh-chassis', msg:'Enter the chassis number'});
    if (!D['decl-veh-engine'])  errors.push({id:'decl-veh-engine',  msg:'Enter the engine number'});
    if (!D['decl-veh-seats'])   errors.push({id:'decl-veh-seats',   msg:'Enter the number of seats'});
  }

  if (pageId === 'declaration') {
    if (!D['declaration-agree']) errors.push({id:'declaration-agree', msg:'Declaration – You must confirm the declaration to continue'});
  }

  return errors;
}

GovBB.init({
  formName: FORM_NAME,
  flow: FLOW,
  pages: PAGES,
  validate: validate
});
</script>
