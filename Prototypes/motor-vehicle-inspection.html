<script src="../assets/govbb-framework.js"></script>
<script>
const FORM_NAME = 'Apply for a Motor Vehicle Inspection';

const FLOW = [
  'start',
  'owner-details',
  'vehicle-category',
  'vehicle-config',
  'vehicle-details',
  'vehicle-specs',
  'exam-date',
  'declaration',
  'check',
  'confirmation'
];

const PAGES = {
  'start': () => `
    <div class="space-y-8">
      <h1 class="font-bold text-[3.5rem] leading-[1.15]">${FORM_NAME}</h1>
      <p class="text-[1.25rem] text-bb-mid-grey-00">Last updated: April 2026</p>
      <p class="text-[1.25rem]">Use this service to apply for an inspection of your motor vehicle by the Barbados Licensing Authority (BLA). All vehicles must pass an inspection before they can be registered or re-registered.</p>
      <div class="space-y-4">
        <h2 class="font-bold text-[1.5rem]">What you will need</h2>
        <ul class="list-disc pl-6 space-y-2 text-[1.25rem]">
          <li>The vehicle owner's name, phone number and address</li>
          <li>The vehicle's chassis number and engine number</li>
          <li>Details about the vehicle — make, model, year, colour and weight</li>
          <li>The vehicle's current registration number (if it has one)</li>
          <li>Your preferred examination date and time</li>
        </ul>
      </div>
      <p class="text-[1.25rem] text-bb-mid-grey-00">It should take about 15 minutes to complete this form.</p>
      ${GovBB.startBtn()}
    </div>`,

  'owner-details': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Owner details</h1>
      <div class="space-y-8">
        ${GovBB.textField('ownerFullName', 'Full name of vehicle owner')}
        ${GovBB.telField('ownerTel', 'Phone number', { hint: 'For example, 246-555-1234', placeholder: '246-555-1234' })}
        ${GovBB.textField('ownerStreet', 'Street address')}
        ${GovBB.selectField('ownerParish', 'Parish', GovBB.PARISHES)}
        ${GovBB.textField('ownerPostalCode', 'Postal code', { hint: 'For example, BB11000', placeholder: 'BB11000' })}
        ${GovBB.continueBtn()}
      </div>
    </form>`,

  'vehicle-category': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Type of vehicle and inspection</h1>
      <div class="space-y-8">
        ${GovBB.radioGroup('vehicleCategory', 'What type of vehicle is it?', [
          'Private motor car',
          'Motor cycle',
          'Motor lorry/goods vehicle',
          'Public service vehicle',
          'Agricultural vehicle',
          'Special purpose vehicle'
        ])}
        ${GovBB.radioGroup('inspectionPurpose', 'Why does the vehicle need an inspection?', [
          'Initial registration',
          'Transfer of ownership',
          'Following repairs or modifications',
          'Other'
        ])}
        ${GovBB.continueBtn()}
      </div>
    </form>`,

  'vehicle-config': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Vehicle configuration</h1>
      <div class="space-y-8">
        ${GovBB.textField('numberOfAxles', 'Number of axles', { hint: 'Most cars have 2 axles.', inputmode: 'numeric', width: '8rem' })}
        ${GovBB.radioGroup('handDrive', 'Which side is the steering wheel on?', [
          'Right-hand drive',
          'Left-hand drive'
        ])}
        ${GovBB.textField('vehiclePurpose', 'What will the vehicle be used for?', { hint: 'For example, private transport, goods delivery, public hire.' })}
        ${GovBB.continueBtn()}
      </div>
    </form>`,

  'vehicle-details': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Vehicle details</h1>
      <div class="space-y-8">
        ${GovBB.textField('manufacturerName', 'Make or manufacturer', { hint: 'For example, Toyota, Nissan, Ford.' })}
        ${GovBB.textField('vehicleDescription', 'Model', { hint: 'For example, Corolla, Sunny, Ranger.' })}
        ${GovBB.textField('manufacturerCountry', 'Country of manufacture', { hint: 'For example, Japan, United States, Germany.' })}
        ${GovBB.textField('yearManufactured', 'Year of manufacture', { inputmode: 'numeric', width: '8rem', hint: 'For example, 2019' })}
        ${GovBB.textField('primaryColour', 'Primary colour', { hint: 'The main colour of the vehicle.' })}
        ${GovBB.textField('secondaryColour', 'Secondary colour (optional)', { hint: 'Leave blank if the vehicle is one colour.' })}
        ${GovBB.textField('chassisNumber', 'Chassis number', { hint: 'Also known as the VIN. You can find this on the vehicle identification plate.' })}
        ${GovBB.textField('engineNumber', 'Engine number', { hint: 'You can find this stamped on the engine block.' })}
        ${GovBB.radioGroup('previouslyRegistered', 'Has this vehicle been registered in Barbados before?', ['Yes', 'No'])}
        <div id="reg-number-wrap" style="display:${GovBB.D['previouslyRegistered'] === 'Yes' ? '' : 'none'}">
          ${GovBB.textField('registrationNo', 'Current registration number')}
        </div>
        ${GovBB.continueBtn()}
      </div>
    </form>`,

  'vehicle-specs': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Vehicle specifications</h1>
      <div class="space-y-8">
        ${GovBB.textField('numberOfCylinders', 'Number of cylinders', { inputmode: 'numeric', width: '8rem' })}
        ${GovBB.textField('engineCapacity', 'Engine capacity (cc)', { hint: 'For example, 1500', inputmode: 'numeric', width: '10rem' })}
        ${GovBB.textField('weightCertificate', 'Weight of vehicle (kg)', { hint: 'The unladen weight from the weight certificate.', inputmode: 'numeric', width: '10rem' })}
        ${GovBB.textField('grossWeight', 'Gross weight (kg)', { hint: 'The maximum loaded weight of the vehicle.', inputmode: 'numeric', width: '10rem' })}
        ${GovBB.textField('numberOfPassengers', 'Number of passengers', { hint: 'How many passengers can the vehicle carry, not including the driver?', inputmode: 'numeric', width: '8rem' })}
        ${GovBB.continueBtn()}
      </div>
    </form>`,

  'exam-date': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Preferred examination date and time</h1>
      <div class="space-y-8">
        ${GovBB.dateField('exam', 'Preferred examination date', 'For example, 15 05 2026')}
        ${GovBB.textField('examTime', 'Preferred time', { hint: 'For example, 09:00 AM', placeholder: '09:00 AM', width: '10rem' })}
        <p class="text-[1rem] text-bb-mid-grey-00">The BLA will confirm your appointment date and time. Your preferred date may not always be available.</p>
        ${GovBB.continueBtn()}
      </div>
    </form>`,

  'declaration': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Declaration</h1>
      <div class="space-y-8">
        <div class="space-y-2 mb-6">
          <p class="text-[1.25rem]"><span class="font-bold">Owner's name:</span> ${GovBB.D['ownerFullName'] || '\u2014'}</p>
          <p class="text-[1.25rem]"><span class="font-bold">Date:</span> ${(function(){ var d=new Date(); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); })()}</p>
        </div>
        <p class="text-[1.25rem]">I declare that the information I have given about this vehicle is true and complete to the best of my knowledge. I understand that giving false information may result in my application being rejected.</p>
        ${GovBB.checkboxItem('declaration-agree', 'I confirm that the information I have given is true and complete.')}
        <div class="mt-8 flex gap-4">
          <button type="button" onclick="back()" class="relative inline-flex items-center justify-center gap-2 text-[20px] whitespace-nowrap transition-colors duration-200 outline-none bg-bb-grey-00 text-bb-black-00 hover:bg-[#c5ccd4] px-xm py-s rounded-sm leading-[1.7] focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-offset-1 focus-visible:ring-bb-teal-100">Back</button>
          <button type="button" onclick="next()" class="relative inline-flex items-center justify-center gap-2 text-[20px] whitespace-nowrap transition-[background-color,box-shadow] duration-200 outline-none bg-bb-teal-00 text-bb-white-00 hover:bg-[#1a777d] hover:shadow-[inset_0_0_0_4px_rgba(222,245,246,0.10)] active:bg-[#0a4549] active:shadow-[inset_0_0_0_3px_rgba(0,0,0,0.20)] px-xm py-s rounded-sm leading-[1.7] focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-offset-1 focus-visible:ring-bb-teal-100">Submit application</button>
        </div>
      </div>
    </form>`,

  'check': () => {
    const D = GovBB.D;
    const examDate = [D['exam-day'], D['exam-month'], D['exam-year']].filter(Boolean).join(' / ');
    return `
    <div>
      ${GovBB.backLink()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Check your answers before sending your application</h1>
      <div class="space-y-8">

        <h2 class="font-bold text-[1.5rem]">Owner details</h2>
        <dl>
          ${GovBB.summaryRow('Full name', D['ownerFullName'], 'owner-details')}
          ${GovBB.summaryRow('Phone number', D['ownerTel'], 'owner-details')}
          ${GovBB.summaryRow('Street address', D['ownerStreet'], 'owner-details')}
          ${GovBB.summaryRow('Parish', D['ownerParish'], 'owner-details')}
          ${GovBB.summaryRow('Postal code', D['ownerPostalCode'], 'owner-details')}
        </dl>

        <h2 class="font-bold text-[1.5rem]">Type of vehicle and inspection</h2>
        <dl>
          ${GovBB.summaryRow('Vehicle type', D['vehicleCategory'], 'vehicle-category')}
          ${GovBB.summaryRow('Reason for inspection', D['inspectionPurpose'], 'vehicle-category')}
        </dl>

        <h2 class="font-bold text-[1.5rem]">Vehicle configuration</h2>
        <dl>
          ${GovBB.summaryRow('Number of axles', D['numberOfAxles'], 'vehicle-config')}
          ${GovBB.summaryRow('Steering wheel side', D['handDrive'], 'vehicle-config')}
          ${GovBB.summaryRow('Purpose of vehicle', D['vehiclePurpose'], 'vehicle-config')}
        </dl>

        <h2 class="font-bold text-[1.5rem]">Vehicle details</h2>
        <dl>
          ${GovBB.summaryRow('Make / manufacturer', D['manufacturerName'], 'vehicle-details')}
          ${GovBB.summaryRow('Model', D['vehicleDescription'], 'vehicle-details')}
          ${GovBB.summaryRow('Country of manufacture', D['manufacturerCountry'], 'vehicle-details')}
          ${GovBB.summaryRow('Year of manufacture', D['yearManufactured'], 'vehicle-details')}
          ${GovBB.summaryRow('Primary colour', D['primaryColour'], 'vehicle-details')}
          ${D['secondaryColour'] ? GovBB.summaryRow('Secondary colour', D['secondaryColour'], 'vehicle-details') : ''}
          ${GovBB.summaryRow('Chassis number', D['chassisNumber'], 'vehicle-details')}
          ${GovBB.summaryRow('Engine number', D['engineNumber'], 'vehicle-details')}
          ${GovBB.summaryRow('Previously registered in Barbados', D['previouslyRegistered'], 'vehicle-details')}
          ${D['previouslyRegistered'] === 'Yes' ? GovBB.summaryRow('Registration number', D['registrationNo'], 'vehicle-details') : ''}
        </dl>

        <h2 class="font-bold text-[1.5rem]">Vehicle specifications</h2>
        <dl>
          ${GovBB.summaryRow('Number of cylinders', D['numberOfCylinders'], 'vehicle-specs')}
          ${GovBB.summaryRow('Engine capacity', D['engineCapacity'] ? D['engineCapacity'] + ' cc' : '', 'vehicle-specs')}
          ${GovBB.summaryRow('Weight', D['weightCertificate'] ? D['weightCertificate'] + ' kg' : '', 'vehicle-specs')}
          ${GovBB.summaryRow('Gross weight', D['grossWeight'] ? D['grossWeight'] + ' kg' : '', 'vehicle-specs')}
          ${GovBB.summaryRow('Number of passengers', D['numberOfPassengers'], 'vehicle-specs')}
        </dl>

        <h2 class="font-bold text-[1.5rem]">Examination date and time</h2>
        <dl>
          ${GovBB.summaryRow('Preferred date', examDate, 'exam-date')}
          ${GovBB.summaryRow('Preferred time', D['examTime'], 'exam-date')}
        </dl>

        ${GovBB.continueBtn('Submit application')}
      </div>
    </div>`;
  },

  'confirmation': () => `
    <div class="space-y-8">
      <div class="confirmation-panel">
        <h1 class="font-bold text-[2rem] leading-[1.15] mb-4">Application submitted</h1>
        <p class="text-[1.25rem]">Your reference number</p>
        <p class="text-[2rem] font-bold">${window.__refNumber || 'LA-' + Math.random().toString(36).substring(2,8).toUpperCase()}</p>
      </div>
      <h2 class="font-bold text-[1.5rem]">What happens next</h2>
      <p class="text-[1.25rem]">We got your application. The Barbados Licensing Authority will review it and confirm your inspection date.</p>
      <p class="text-[1.25rem]">You will be contacted by phone or email with the confirmed date and time. Please bring your vehicle and all relevant documents to the inspection.</p>
      <h2 class="font-bold text-[1.5rem]">Contact the BLA</h2>
      <p class="text-[1.25rem]">Phone: (246) 426-3981</p>
      <p class="text-[1.25rem]">Address: Pine East-West Boulevard, The Pine, St. Michael, Barbados</p>
    </div>`
};

function validate(pageId) {
  const D = GovBB.D;
  const errors = [];

  if (pageId === 'owner-details') {
    if (!D['ownerFullName']) errors.push({ id: 'ownerFullName', msg: 'Enter the full name of the vehicle owner' });
    if (!D['ownerTel']) errors.push({ id: 'ownerTel', msg: 'Enter a phone number' });
    if (!D['ownerStreet']) errors.push({ id: 'ownerStreet', msg: 'Enter a street address' });
    if (!D['ownerParish']) errors.push({ id: 'ownerParish', msg: 'Select a parish' });
    if (D['ownerPostalCode'] && !/^BB\d{5}$/.test(D['ownerPostalCode']))
      errors.push({ id: 'ownerPostalCode', msg: 'Enter a valid postal code, for example BB11000' });
  }

  if (pageId === 'vehicle-category') {
    if (!D['vehicleCategory']) errors.push({ id: 'vehicleCategory', msg: 'Select the type of vehicle' });
    if (!D['inspectionPurpose']) errors.push({ id: 'inspectionPurpose', msg: 'Select the reason for the inspection' });
  }

  if (pageId === 'vehicle-config') {
    if (!D['numberOfAxles']) errors.push({ id: 'numberOfAxles', msg: 'Enter the number of axles' });
    if (!D['handDrive']) errors.push({ id: 'handDrive', msg: 'Select which side the steering wheel is on' });
  }

  if (pageId === 'vehicle-details') {
    if (!D['manufacturerName']) errors.push({ id: 'manufacturerName', msg: 'Enter the make or manufacturer' });
    if (!D['vehicleDescription']) errors.push({ id: 'vehicleDescription', msg: 'Enter the model' });
    if (!D['yearManufactured']) errors.push({ id: 'yearManufactured', msg: 'Enter the year of manufacture' });
    if (!D['primaryColour']) errors.push({ id: 'primaryColour', msg: 'Enter the primary colour' });
    if (!D['chassisNumber']) errors.push({ id: 'chassisNumber', msg: 'Enter the chassis number' });
    if (!D['engineNumber']) errors.push({ id: 'engineNumber', msg: 'Enter the engine number' });
    if (!D['previouslyRegistered']) errors.push({ id: 'previouslyRegistered', msg: 'Select whether the vehicle has been registered before' });
    if (D['previouslyRegistered'] === 'Yes' && !D['registrationNo'])
      errors.push({ id: 'registrationNo', msg: 'Enter the current registration number' });
  }

  if (pageId === 'vehicle-specs') {
    if (!D['numberOfCylinders']) errors.push({ id: 'numberOfCylinders', msg: 'Enter the number of cylinders' });
    if (!D['engineCapacity']) errors.push({ id: 'engineCapacity', msg: 'Enter the engine capacity in cc' });
    if (!D['weightCertificate']) errors.push({ id: 'weightCertificate', msg: 'Enter the weight of the vehicle' });
    if (!D['grossWeight']) errors.push({ id: 'grossWeight', msg: 'Enter the gross weight' });
    if (!D['numberOfPassengers']) errors.push({ id: 'numberOfPassengers', msg: 'Enter the number of passengers' });
  }

  if (pageId === 'exam-date') {
    if (!D['exam-day'] || !D['exam-month'] || !D['exam-year'])
      errors.push({ id: 'exam-day', msg: 'Enter your preferred examination date' });
    if (!D['examTime']) errors.push({ id: 'examTime', msg: 'Enter your preferred time' });
  }

  if (pageId === 'declaration') {
    if (!D['declaration-agree']) errors.push({ id: 'declaration-agree', msg: 'You must confirm the declaration to continue' });
  }

  return errors;
}

GovBB.init({
  formName: FORM_NAME,
  flow: FLOW,
  pages: PAGES,
  validate: validate,
  onRadioChange: function(name, value) {
    if (name === 'previouslyRegistered') {
      var wrap = document.getElementById('reg-number-wrap');
      if (wrap) wrap.style.display = value === 'Yes' ? '' : 'none';
    }
  }
});
</script>
</body>
