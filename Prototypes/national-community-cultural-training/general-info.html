<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>General information – National Community Cultural Training Programme 2025</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Flag_of_Barbados.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/govbb-tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/govbb-base.css">
</head>
<body>
<div id="chrome-top"></div>
<main><div class="container py-l max-w-3xl" id="app"></div></main>
<div id="chrome-bottom"></div>
<script src="/assets/govbb-framework.js"></script>
<script src="/assets/ydp-multipage.js"></script>
<script>
const HOW_HEARD = [
  'Division of Youth Affairs Website','Division of Youth Affairs Facebook','Division of Youth Affairs Instagram',
  'Youth Commissioner / Ministry Staff','Advertisement (Radio or TV)','Brochure','Flyer','Email Promotion','Family member or friend'
];

YDP.initPage({
  formName: 'National Community Cultural Training Programme 2025',
  storeKey: 'ydp_ncctp',
  pageId: 'general-info',
  nextUrl: 'check.html',
  validate: () => {
    const errs = [];
    if (YDP.collectChecks('how-heard').length === 0 && !GovBB.D['how-heard__Other']) {
      errs.push({id:'how-heard__Division of Youth Affairs Website', msg:'Choose how you heard about the programme'});
    }
    if (!GovBB.D['in-clubs']) errs.push({id:'in-clubs', msg:'Tell us if you belong to any clubs'});
    return errs;
  },
  template: () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">General information</h1>
      <div class="space-y-8">
        ${YDP.checkboxGroup('how-heard', 'How did you hear about the programme?', HOW_HEARD, { includeOther: true, hint: 'Choose all that apply.' })}
        ${GovBB.radioGroup('in-clubs', 'Do you belong to any clubs, groups or organisations?', ['Yes','No'])}
        ${YDP.revealWhen('in-clubs', 'Yes',
          GovBB.textareaField('clubs-list', 'Which clubs, groups or organisations?', { rows: 4 })
        )}
        ${GovBB.continueBtn()}
      </div>
    </form>`
});
</script>
</body>
</html>
