<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your information – National Community Cultural Training Programme 2025</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Flag_of_Barbados.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/govbb-tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/govbb-base.css">
</head>
<body>
<div id="chrome-top"></div>
<main><div class="container py-l max-w-3xl" id="app"></div></main>
<div id="chrome-bottom"></div>
<script src="/assets/govbb-framework.js"></script>
<script src="/assets/ydp-multipage.js"></script>
<script>
const AGES = [];
for (let a = 9; a <= 21; a++) AGES.push(String(a));

YDP.initPage({
  formName: 'National Community Cultural Training Programme 2025',
  storeKey: 'ydp_ncctp',
  pageId: 'personal-info',
  nextUrl: 'required-and-course-info.html',
  validate: () => {
    const errs = [];
    const D = GovBB.D;
    if (!D['full-name']) errs.push({id:'full-name', msg:'Enter your name'});
    if (!D['gender']) errs.push({id:'gender', msg:'Choose your gender'});
    if (!D['age']) errs.push({id:'age', msg:'Choose your age'});
    if (!D['dob-day'] || !D['dob-month'] || !D['dob-year']) errs.push({id:'dob-day', msg:'Enter your date of birth'});
    if (!D['address']) errs.push({id:'address', msg:'Enter your address'});
    if (!D['parish']) errs.push({id:'parish', msg:'Choose your parish'});
    if (!D['telephone']) errs.push({id:'telephone', msg:'Enter a telephone number'});
    if (!D['email']) errs.push({id:'email', msg:'Enter your email address'});
    if (!D['country-of-birth']) errs.push({id:'country-of-birth', msg:'Enter your country of birth'});
    if (!D['nationality']) errs.push({id:'nationality', msg:'Choose your nationality'});
    if (!D['employment-status']) errs.push({id:'employment-status', msg:'Choose your current status'});
    if (!D['qualification']) errs.push({id:'qualification', msg:'Choose your highest qualification'});
    return errs;
  },
  template: () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Your information</h1>
      <div class="space-y-8">
        ${GovBB.textField('full-name', 'Your first and last name')}
        ${YDP.radioWithOther('gender', 'What is your gender?', ['Female', 'Male', 'Prefer not to say'])}
        ${GovBB.selectField('age', 'How old are you?', AGES)}
        ${GovBB.dateField('dob', 'Date of birth')}
        ${GovBB.textareaField('address', 'What is your address?')}
        ${GovBB.selectField('parish', 'Parish', GovBB.PARISHES)}
        ${GovBB.telField('telephone', 'Telephone number', { hint: 'A home, work or mobile number', placeholder: '246-555-1234' })}
        ${GovBB.emailField('email', 'Email address')}
        ${GovBB.textField('country-of-birth', 'Country of birth')}
        ${YDP.radioWithOther('nationality', 'Nationality', ['Barbadian', 'CARICOM National', 'European National', 'U.S. National', 'British Citizen'])}
        ${YDP.radioWithOther('employment-status', 'I am currently', [
          'Employed (Full-time)',
          'Employed (Part-time)',
          'In School (Full-time)',
          'In School (Part-time)',
          'Unemployed (actively seeking employment)',
          'Unemployed (not seeking employment)',
          'Self-Employed'
        ])}
        ${GovBB.selectField('qualification', 'Highest level of qualification', [
          'CCSLC','CXC/CSEC','CAPE','CVQs','NVQs','GCE-O-Level','City & Guilds',
          'Certificate','Diploma','Associates','Bachelors','Masters','Doctorate',
          'Professional Qualification (e.g. ACCA)','None'
        ])}
        ${GovBB.textareaField('institution', 'If you are studying, what is the name of your school or institution?', { hint: 'Leave blank if this does not apply', rows: 3 })}
        ${GovBB.continueBtn()}
      </div>
    </form>`
});
</script>
</body>
</html>
