<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency contact – National Community Cultural Training Programme 2025</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Flag_of_Barbados.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/govbb-tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/govbb-base.css">
</head>
<body>
<div id="chrome-top"></div>
<main><div class="container py-l max-w-3xl" id="app"></div></main>
<div id="chrome-bottom"></div>
<script src="/assets/govbb-framework.js"></script>
<script src="/assets/ydp-multipage.js"></script>
<script>
YDP.initPage({
  formName: 'National Community Cultural Training Programme 2025',
  storeKey: 'ydp_ncctp',
  pageId: 'emergency-contact',
  nextUrl: 'general-info.html',
  validate: () => {
    const errs = [];
    const D = GovBB.D;
    if (!D['ec-name']) errs.push({id:'ec-name', msg:'Enter a name'});
    if (!D['ec-relationship']) errs.push({id:'ec-relationship', msg:'Enter your relationship to them'});
    if (!D['ec-phone']) errs.push({id:'ec-phone', msg:'Enter a phone number'});
    return errs;
  },
  template: () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Emergency contact</h1>
      <div class="space-y-8">
        ${GovBB.textField('ec-name', 'Their first and last name')}
        ${GovBB.textField('ec-relationship', 'Your relationship to them', { hint: 'For example, parent or guardian' })}
        ${GovBB.textareaField('ec-address', 'Their address', { hint: 'Only if different from yours', rows: 3 })}
        ${GovBB.telField('ec-phone', 'Their phone number', { hint: 'A home or mobile number', placeholder: '246-555-1234' })}
        ${GovBB.continueBtn()}
      </div>
    </form>`
});
</script>
</body>
</html>
