<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Required and course information – National Community Cultural Training Programme 2025</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Flag_of_Barbados.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/govbb-tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/govbb-base.css">
</head>
<body>
<div id="chrome-top"></div>
<main><div class="container py-l max-w-3xl" id="app"></div></main>
<div id="chrome-bottom"></div>
<script src="/assets/govbb-framework.js"></script>
<script src="/assets/ydp-multipage.js"></script>
<script>
const DISCIPLINES = ['Dance','Drama','Steel Pan','Stilt Walking','Shaggy Bear','Landship','Violin','Drumming','Voice Training'];

YDP.initPage({
  formName: 'National Community Cultural Training Programme 2025',
  storeKey: 'ydp_ncctp',
  pageId: 'course-info',
  nextUrl: 'medical.html',
  validate: () => {
    const errs = [];
    const D = GovBB.D;
    if (!D['nrn']) errs.push({id:'nrn', msg:'Enter your National Registration Number'});
    if (YDP.collectChecks('disciplines').length === 0) errs.push({id:'disciplines__Dance', msg:'Choose at least one discipline'});
    if (!D['has-experience']) errs.push({id:'has-experience', msg:'Tell us if you have experience'});
    return errs;
  },
  template: () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-4">Required and course information</h1>
      <div class="space-y-8">
        ${GovBB.textField('nrn', 'National Registration Number', { hint: 'This is on your national ID card. For example, 870315-1234' })}
        ${YDP.checkboxGroup('disciplines', 'Which disciplines are you most interested in?', DISCIPLINES, { hint: 'Choose one or more.' })}
        ${GovBB.radioGroup('has-experience', 'Do you have any experience in the disciplines you chose?', ['Yes','No'], { hint: 'If no, choose No and continue.' })}
        ${YDP.revealWhen('has-experience', 'Yes',
          YDP.radioWithOther('experience-level', 'What is your level of experience?', ['Beginner','Intermediate','Advanced','Expert (Professional)']) +
          GovBB.textField('experience-years', 'How many years of experience do you have?', { width: '10rem' }) +
          GovBB.textField('experience-location', 'Where did you receive training?')
        )}
        ${GovBB.continueBtn()}
      </div>
    </form>`
});
</script>
</body>
</html>
