        <a href="#" class="underline underline-offset-2 hover:no-underline text-bb-white-00">Privacy</a>
        <a href="#" class="underline underline-offset-2 hover:no-underline text-bb-white-00">Terms</a>

      </div>

<script src="../assets/govbb-framework.js"></script>
<script>
const FORM_NAME = 'Register Your Vehicle for a Temporary Stay in Barbados';

const FLOW = ['start','your-details','vehicle-config','vehicle-ids','insurance','vehicle-details','declaration','check','confirmation'];

const PAGES = {
  'start': () => `
    <div class="space-y-8">
      <h1 class="font-bold text-[3.5rem] leading-[1.15]">${FORM_NAME}</h1>
      <p class="text-[1.25rem]">Use this service to register a foreign vehicle for temporary use in Barbados. This applies to vehicles brought into the country by visitors or temporary residents.</p>
      <div class="space-y-4">
        <h2 class="font-bold text-[1.5rem]">What you will need</h2>
        <ul class="list-disc pl-6 space-y-2 text-[1.25rem]">
          <li>Your name, address and contact details</li>
          <li>Your vehicle's chassis number</li>
          <li>Your vehicle's make, model, year and colour</li>
          <li>Your insurance details, including the insurer name, policy number and type of cover</li>
        </ul>
      </div>
      <p class="text-[1.25rem] text-bb-mid-grey-00">It should take about 10 minutes to complete this form.</p>
      ${GovBB.startBtn()}
    </div>`,

  'your-details': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Your details</h1>
      <div class="space-y-8">
        ${GovBB.textField('fullname','Full name')}
        ${GovBB.textareaField('address','Address',{hint:'Include your street, city or town, and country.',rows:3})}
        ${GovBB.emailField('email','Email address',{hint:'We will use this to send you a confirmation.'})}
        ${GovBB.telField('contact','Contact number',{hint:'For example, +1-246-555-1234',placeholder:'+1-246-555-1234'})}
        ${GovBB.continueBtn()}
      </div>
    </form>`,

  'vehicle-config': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Steering and fuel type</h1>
      <div class="space-y-8">
        ${GovBB.radioGroup('driveType','Which side is the steering wheel on?',['Left-hand drive','Right-hand drive'])}
        ${GovBB.radioGroup('fuelType','What fuel does your vehicle use?',['Petrol','Diesel','Electric','Hybrid','CNG','LPG'])}
        ${GovBB.continueBtn()}
      </div>
    </form>`,

  'vehicle-ids': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Vehicle identification numbers</h1>
      <div class="space-y-8">
        ${GovBB.textField('chassis','Chassis number',{hint:'Also known as the Vehicle Identification Number (VIN). You can find this on the vehicle registration document or on the vehicle itself.'})}
        ${GovBB.textField('engine','Engine number (optional)',{hint:'Leave blank if your vehicle does not have an engine number.'})}
        ${GovBB.textField('motor','Motor number (optional)',{hint:'For electric or hybrid vehicles. Leave blank if not applicable.'})}
        ${GovBB.continueBtn()}
      </div>
    </form>`,

  'insurance': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Insurance details</h1>
      <div class="space-y-8">
        ${GovBB.textField('insurer','Name of your insurer')}
        ${GovBB.textField('policy','Policy number')}
        ${GovBB.radioGroup('insuranceType','What type of insurance do you have?',['Green Card','Local insurance'])}
        ${GovBB.continueBtn()}
      </div>
    </form>`,

  'vehicle-details': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Vehicle details</h1>
      <div class="space-y-8">
        ${GovBB.textField('make','Make',{hint:'For example, Toyota, Ford, BMW'})}
        ${GovBB.textField('model','Model',{hint:'For example, Corolla, Focus, X3'})}
        ${GovBB.textField('year','Year of manufacture',{inputmode:'numeric',width:'8rem',maxlength:'4',placeholder:'2022'})}
        ${GovBB.textField('colour','Colour')}
        ${GovBB.continueBtn()}
      </div>
    </form>`,

  'declaration': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Declaration</h1>
      <div class="space-y-8">
        <div class="space-y-2 mb-6">
          <p class="text-[1.25rem]"><span class="font-bold">Applicant's name:</span> ${GovBB.D['fullname'] || '—'}</p>
          <p class="text-[1.25rem]"><span class="font-bold">Date:</span> ${(function(){ var d=new Date(); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); })()}</p>
        </div>
        <p class="text-[1.25rem]">I declare that the information I have given is true to the best of my knowledge. I understand that providing false information may result in this registration being refused or withdrawn.</p>
        ${GovBB.checkboxItem('declaration-agree', 'I confirm that the information I have given is true and complete.')}
        <div class="mt-8 flex gap-4">
          <button type="button" onclick="back()" class="relative inline-flex items-center justify-center gap-2 text-[20px] whitespace-nowrap transition-colors duration-200 outline-none bg-bb-grey-00 text-bb-black-00 hover:bg-[#c5ccd4] px-xm py-s rounded-sm leading-[1.7] focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-offset-1 focus-visible:ring-bb-teal-100">Back</button>
          <button type="button" onclick="next()" class="relative inline-flex items-center justify-center gap-2 text-[20px] whitespace-nowrap transition-[background-color,box-shadow] duration-200 outline-none bg-bb-teal-00 text-bb-white-00 hover:bg-[#1a777d] hover:shadow-[inset_0_0_0_4px_rgba(222,245,246,0.10)] active:bg-[#0a4549] active:shadow-[inset_0_0_0_3px_rgba(0,0,0,0.20)] px-xm py-s rounded-sm leading-[1.7] focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-offset-1 focus-visible:ring-bb-teal-100">Submit application</button>
        </div>
      </div>
    </form>`,

  'check': () => `
    <div>
      ${GovBB.backLink()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Check your answers before sending your application</h1>
      <div class="space-y-8">
        <h2 class="font-bold text-[1.5rem]">Your details</h2>
        <dl>
          ${GovBB.summaryRow('Full name', GovBB.D['fullname'], 'your-details')}
          ${GovBB.summaryRow('Address', GovBB.D['address'], 'your-details')}
          ${GovBB.summaryRow('Email address', GovBB.D['email'], 'your-details')}
          ${GovBB.summaryRow('Contact number', GovBB.D['contact'], 'your-details')}
        </dl>
        <h2 class="font-bold text-[1.5rem]">Steering and fuel type</h2>
        <dl>
          ${GovBB.summaryRow('Steering', GovBB.D['driveType'], 'vehicle-config')}
          ${GovBB.summaryRow('Fuel type', GovBB.D['fuelType'], 'vehicle-config')}
        </dl>
        <h2 class="font-bold text-[1.5rem]">Vehicle identification numbers</h2>
        <dl>
          ${GovBB.summaryRow('Chassis number', GovBB.D['chassis'], 'vehicle-ids')}
          ${GovBB.summaryRow('Engine number', GovBB.D['engine'] || 'Not provided', 'vehicle-ids')}
          ${GovBB.summaryRow('Motor number', GovBB.D['motor'] || 'Not provided', 'vehicle-ids')}
        </dl>
        <h2 class="font-bold text-[1.5rem]">Insurance details</h2>
        <dl>
          ${GovBB.summaryRow('Insurer', GovBB.D['insurer'], 'insurance')}
          ${GovBB.summaryRow('Policy number', GovBB.D['policy'], 'insurance')}
          ${GovBB.summaryRow('Insurance type', GovBB.D['insuranceType'], 'insurance')}
        </dl>
        <h2 class="font-bold text-[1.5rem]">Vehicle details</h2>
        <dl>
          ${GovBB.summaryRow('Make', GovBB.D['make'], 'vehicle-details')}
          ${GovBB.summaryRow('Model', GovBB.D['model'], 'vehicle-details')}
          ${GovBB.summaryRow('Year of manufacture', GovBB.D['year'], 'vehicle-details')}
          ${GovBB.summaryRow('Colour', GovBB.D['colour'], 'vehicle-details')}
        </dl>
        ${GovBB.continueBtn('Submit application')}
      </div>
    </div>`,

  'confirmation': () => `
    <div class="space-y-8">
      <div class="confirmation-panel">
        <h1 class="font-bold text-[2rem] leading-[1.15] mb-4">Application submitted</h1>
        <p class="text-[1.25rem]">Your reference number</p>
        <p class="text-[2rem] font-bold">${window.__refNumber || 'RTS-' + Math.random().toString(36).substring(2,8).toUpperCase()}</p>
      </div>
      <h2 class="font-bold text-[1.5rem]">What happens next</h2>
      <p class="text-[1.25rem]">We got your application. The Barbados Licensing Authority will review it and may contact you if they need more information.</p>
      <p class="text-[1.25rem]">You should receive a decision within 5 working days. We will send the result to the email address you gave us.</p>
      <h2 class="font-bold text-[1.5rem]">Contact the Barbados Licensing Authority</h2>
      <p class="text-[1.25rem]">Phone: (246) 426-3981</p>
      <p class="text-[1.25rem]">Address: Pine East-West Boulevard, The Pine, St. Michael, Barbados</p>
    </div>`
};

function validate(pageId) {
  const D = GovBB.D;
  const errors = [];

  if (pageId === 'your-details') {
    if (!D['fullname']) errors.push({id:'fullname', msg:'Enter your full name'});
    if (!D['address'])  errors.push({id:'address',  msg:'Enter your address'});
    if (!D['email'])    errors.push({id:'email',    msg:'Enter your email address'});
    if (!D['contact'])  errors.push({id:'contact',  msg:'Enter your contact number'});
  }

  if (pageId === 'vehicle-config') {
    if (!D['driveType']) errors.push({id:'driveType', msg:'Select which side the steering wheel is on'});
    if (!D['fuelType'])  errors.push({id:'fuelType',  msg:'Select what fuel your vehicle uses'});
  }

  if (pageId === 'vehicle-ids') {
    if (!D['chassis']) errors.push({id:'chassis', msg:'Enter the chassis number'});
  }

  if (pageId === 'insurance') {
    if (!D['insurer'])       errors.push({id:'insurer',       msg:'Enter the name of your insurer'});
    if (!D['policy'])        errors.push({id:'policy',        msg:'Enter your policy number'});
    if (!D['insuranceType']) errors.push({id:'insuranceType', msg:'Select your insurance type'});
  }

  if (pageId === 'vehicle-details') {
    if (!D['make'])   errors.push({id:'make',   msg:'Enter the make of your vehicle'});
    if (!D['model'])  errors.push({id:'model',  msg:'Enter the model of your vehicle'});
    if (!D['year'])   errors.push({id:'year',   msg:'Enter the year of manufacture'});
    if (!D['colour']) errors.push({id:'colour', msg:'Enter the colour of your vehicle'});
  }

  if (pageId === 'declaration') {
    if (!D['declaration-agree']) errors.push({id:'declaration-agree', msg:'Declaration – You must confirm the declaration to continue'});
  }

  return errors;
}

GovBB.init({
  formName: FORM_NAME,
  flow: FLOW,
  pages: PAGES,
  validate: validate
});
</script>
</body>
</html>
