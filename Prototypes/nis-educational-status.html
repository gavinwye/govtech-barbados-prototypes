<!-- Alpha banner -->
<div class="bg-bb-blue-10">
  <div class="container py-xs text-[1rem]">
    This page is in <a href="#" class="inline-flex outline-none underline-offset-2 underline hover:no-underline text-bb-teal-00 hover:text-bb-black-00">Alpha</a>. Your feedback helps us improve.
  </div>
</div>

<!-- Main -->
<main>
  <div class="container py-l max-w-3xl" id="app"></div>
</main>

<!-- Footer -->
<footer class="bg-bb-blue-100 text-bb-white-00">
  <div class="container py-l text-[1rem]">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <p>&copy; 2024 Government of Barbados. All rights reserved.</p>
      <div class="flex gap-4">
        <a href="#" class="underline underline-offset-2 hover:no-underline text-bb-white-00">Privacy</a>
        <a href="#" class="underline underline-offset-2 hover:no-underline text-bb-white-00">Terms</a>
        <a href="#" class="underline underline-offset-2 hover:no-underline text-bb-white-00">Accessibility</a>
      </div>
    </div>
  </div>
</footer>

<script src="../assets/govbb-framework.js"></script>
<script>
const FORM_NAME = 'NIS Educational Status Form';

const FLOW = ['start','student-details','institution-details','declaration','check','confirmation'];

const PAGES = {
  'start': () => `
    <div class="space-y-8">
      <h1 class="font-bold text-[3.5rem] leading-[1.15]">${FORM_NAME}</h1>
      <p class="text-[1.25rem]">Use this form to confirm your enrolment status as a student with the National Insurance Scheme (NIS). Students enrolled full-time at an educational institution may be eligible for continued NIS benefits.</p>
      <div class="space-y-4">
        <h2 class="font-bold text-[1.5rem]">What you will need</h2>
        <ul class="list-disc pl-6 space-y-2 text-[1.25rem]">
          <li>Your National Insurance Number (6 digits)</li>
          <li>Your National Registration Number</li>
          <li>Details of your educational institution</li>
          <li>Your current term dates</li>
          <li>Your email address and phone number</li>
        </ul>
      </div>
      <p class="text-[1.25rem] text-bb-mid-grey-00">It should take about 5 minutes to complete this form.</p>
      ${GovBB.startBtn()}
    </div>`,

  'student-details': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Your details</h1>
      <div class="space-y-8">
        ${GovBB.textField('first-name','First name')}
        ${GovBB.textField('middle-name','Middle name (optional)',{hint:'Include all middle names if you have more than one.'})}
        ${GovBB.textField('last-name','Last name')}
        ${GovBB.textField('nis-number','National Insurance Number',{hint:'This is a 6-digit number. You can find it on your NIS card or payslip.',inputmode:'numeric',maxlength:'6'})}
        ${GovBB.textField('nrn','National Registration Number',{hint:'Find this on your national ID card. Format: YYMMDD-XXXX',placeholder:'870315-1234'})}
        ${GovBB.dateField('dob','Date of birth','For example, 27 03 2007')}
        ${GovBB.textField('address','Street address')}
        ${GovBB.textField('district','District (optional)',{hint:'Village or district name. For example, Brittons Hill.'})}
        ${GovBB.selectField('parish','Parish',GovBB.PARISHES)}
        ${GovBB.textField('postal-code','Postal code',{hint:'For example, BB11000',placeholder:'BB11000',width:'12rem'})}
        ${GovBB.emailField('email','Email address',{hint:'We will use this to contact you about your enrolment status.'})}
        ${GovBB.telField('tel','Landline number (optional)',{hint:'For example, 246-555-1234',placeholder:'246-555-1234'})}
        ${GovBB.telField('cell','Mobile number (optional)',{hint:'You must give at least one phone number — landline or mobile.',placeholder:'246-555-1234'})}
        ${GovBB.continueBtn()}
      </div>
    </form>`,

  'institution-details': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Your institution details</h1>
      <div class="space-y-8">
        ${GovBB.textField('institution-name','Name of educational institution')}
        ${GovBB.textField('institution-address','Institution address')}
        ${GovBB.textField('institution-country','Country',{hint:'For example, Barbados'})}
        ${GovBB.radioGroup('education-level','What level of education are you studying?',['Secondary (High School)','Tertiary (University/College/Technical Institute)','Other'])}
        ${GovBB.radioGroup('enrolled-fulltime','Are you enrolled full-time?',['Yes','No'])}
        ${GovBB.dateField('enrolment-date','Date of enrolment','For example, 01 09 2024')}
        ${GovBB.dateField('term-from','Current term start date','For example, 01 01 2025')}
        ${GovBB.dateField('term-to','Current term end date','For example, 30 04 2025')}
        ${GovBB.continueBtn()}
      </div>
    </form>`,

  'declaration': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Declaration</h1>
      <div class="space-y-8">
        <div class="space-y-2 mb-6">
          <p class="text-[1.25rem]"><span class="font-bold">Student name:</span> ${[GovBB.D['first-name'], GovBB.D['middle-name'], GovBB.D['last-name']].filter(Boolean).join(' ') || '—'}</p>
          <p class="text-[1.25rem]"><span class="font-bold">Date:</span> ${(function(){ var d=new Date(); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); })()}</p>
        </div>
        <p class="text-[1.25rem]">I declare that the information I have given is true to the best of my knowledge and belief. I understand that NIS may contact my institution to verify my enrolment status.</p>
        ${GovBB.checkboxItem('declaration-agree', 'I confirm that the information I have given is true and complete to the best of my knowledge.')}
        <div class="mt-8 flex gap-4">
          <button type="button" onclick="back()" class="relative inline-flex items-center justify-center gap-2 text-[20px] whitespace-nowrap transition-colors duration-200 outline-none bg-bb-grey-00 text-bb-black-00 hover:bg-[#c5ccd4] px-xm py-s rounded-sm leading-[1.7] focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-offset-1 focus-visible:ring-bb-teal-100">Back</button>
          <button type="button" onclick="next()" class="relative inline-flex items-center justify-center gap-2 text-[20px] whitespace-nowrap transition-[background-color,box-shadow] duration-200 outline-none bg-bb-teal-00 text-bb-white-00 hover:bg-[#1a777d] hover:shadow-[inset_0_0_0_4px_rgba(222,245,246,0.10)] active:bg-[#0a4549] active:shadow-[inset_0_0_0_3px_rgba(0,0,0,0.20)] px-xm py-s rounded-sm leading-[1.7] focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-offset-1 focus-visible:ring-bb-teal-100">Submit application</button>
        </div>
      </div>
    </form>`,

  'check': () => `
    <div>
      ${GovBB.backLink()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Check your answers before sending your application</h1>
      <div class="space-y-8">
        <h2 class="font-bold text-[1.5rem]">Student details</h2>
        <dl>
          ${GovBB.summaryRow('First name', GovBB.D['first-name'], 'student-details')}
          ${GovBB.summaryRow('Middle name', GovBB.D['middle-name'], 'student-details')}
          ${GovBB.summaryRow('Last name', GovBB.D['last-name'], 'student-details')}
          ${GovBB.summaryRow('National Insurance Number', GovBB.D['nis-number'], 'student-details')}
          ${GovBB.summaryRow('National Registration Number', GovBB.D['nrn'], 'student-details')}
          ${GovBB.summaryRow('Date of birth', [GovBB.D['dob-day'],GovBB.D['dob-month'],GovBB.D['dob-year']].filter(Boolean).join(' / '), 'student-details')}
        </dl>
        <h2 class="font-bold text-[1.5rem]">Address and contact</h2>
        <dl>
          ${GovBB.summaryRow('Street address', GovBB.D['address'], 'student-details')}
          ${GovBB.summaryRow('District', GovBB.D['district'], 'student-details')}
          ${GovBB.summaryRow('Parish', GovBB.D['parish'], 'student-details')}
          ${GovBB.summaryRow('Postal code', GovBB.D['postal-code'], 'student-details')}
          ${GovBB.summaryRow('Email address', GovBB.D['email'], 'student-details')}
          ${GovBB.summaryRow('Landline number', GovBB.D['tel'], 'student-details')}
          ${GovBB.summaryRow('Mobile number', GovBB.D['cell'], 'student-details')}
        </dl>
        <h2 class="font-bold text-[1.5rem]">Institution details</h2>
        <dl>
          ${GovBB.summaryRow('Institution name', GovBB.D['institution-name'], 'institution-details')}
          ${GovBB.summaryRow('Institution address', GovBB.D['institution-address'], 'institution-details')}
          ${GovBB.summaryRow('Country', GovBB.D['institution-country'], 'institution-details')}
          ${GovBB.summaryRow('Education level', GovBB.D['education-level'], 'institution-details')}
          ${GovBB.summaryRow('Enrolled full-time', GovBB.D['enrolled-fulltime'], 'institution-details')}
          ${GovBB.summaryRow('Date of enrolment', [GovBB.D['enrolment-date-day'],GovBB.D['enrolment-date-month'],GovBB.D['enrolment-date-year']].filter(Boolean).join(' / '), 'institution-details')}
          ${GovBB.summaryRow('Term start date', [GovBB.D['term-from-day'],GovBB.D['term-from-month'],GovBB.D['term-from-year']].filter(Boolean).join(' / '), 'institution-details')}
          ${GovBB.summaryRow('Term end date', [GovBB.D['term-to-day'],GovBB.D['term-to-month'],GovBB.D['term-to-year']].filter(Boolean).join(' / '), 'institution-details')}
        </dl>
        ${GovBB.continueBtn('Submit application')}
      </div>
    </div>`,

  'confirmation': () => `
    <div class="space-y-8">
      <div class="confirmation-panel">
        <h1 class="font-bold text-[2rem] leading-[1.15] mb-4">Application submitted</h1>
        <p class="text-[1.25rem]">Your reference number</p>
        <p class="text-[2rem] font-bold">${window.__refNumber || 'ESF-' + Math.random().toString(36).substring(2,8).toUpperCase()}</p>
      </div>
      <h2 class="font-bold text-[1.5rem]">What happens next</h2>
      <p class="text-[1.25rem]">We got your application. NIS will review your enrolment status and may contact your institution to verify.</p>
      <p class="text-[1.25rem]">If we need more information, we will contact you using the email address or phone number you gave us.</p>
      <h2 class="font-bold text-[1.5rem]">Contact NIS</h2>
      <p class="text-[1.25rem]">Phone: (246) 431-7400 or (246) 467-4647</p>
      <p class="text-[1.25rem]">Email: customer.service@bginis.gov.bb</p>
      <p class="text-[1.25rem]">Address: Frank Walcott Building, Culloden Road, St. Michael, Barbados</p>
    </div>`
};

function validate(pageId) {
  const D = GovBB.D;
  const errors = [];

  if (pageId === 'student-details') {
    if (!D['first-name']) errors.push({id:'first-name', msg:'Enter your first name'});
    if (!D['last-name'])  errors.push({id:'last-name',  msg:'Enter your last name'});
    if (!D['nis-number']) errors.push({id:'nis-number', msg:'Enter your National Insurance Number'});
    else if (!/^\d{6}$/.test(D['nis-number'])) errors.push({id:'nis-number', msg:'National Insurance Number must be 6 digits'});
    if (!D['nrn']) errors.push({id:'nrn', msg:'Enter your National Registration Number'});
    else if (!/^\d{6}-\d{4}$/.test(D['nrn'])) errors.push({id:'nrn', msg:'National Registration Number must be in the format YYMMDD-XXXX, for example 870315-1234'});
    if (!D['dob-day'] || !D['dob-month'] || !D['dob-year']) errors.push({id:'dob-day', msg:'Enter your date of birth'});
    if (!D['address']) errors.push({id:'address', msg:'Enter your street address'});
    if (!D['parish'])  errors.push({id:'parish',  msg:'Select your parish'});
    if (!D['postal-code']) errors.push({id:'postal-code', msg:'Enter your postal code'});
    else if (!/^BB\d{5}$/.test(D['postal-code'])) errors.push({id:'postal-code', msg:'Postal code must start with BB followed by 5 digits, for example BB11000'});
    if (!D['email']) errors.push({id:'email', msg:'Enter your email address'});
    if (!D['tel'] && !D['cell']) errors.push({id:'tel', msg:'Enter at least one phone number — landline or mobile'});
  }

  if (pageId === 'institution-details') {
    if (!D['institution-name'])    errors.push({id:'institution-name',    msg:'Enter the name of your educational institution'});
    if (!D['institution-address']) errors.push({id:'institution-address', msg:'Enter the institution address'});
    if (!D['institution-country']) errors.push({id:'institution-country', msg:'Enter the country'});
    if (!D['education-level'])     errors.push({id:'education-level',     msg:'Select your level of education'});
    if (!D['enrolled-fulltime'])   errors.push({id:'enrolled-fulltime',   msg:'Tell us if you are enrolled full-time'});
    if (!D['enrolment-date-day'] || !D['enrolment-date-month'] || !D['enrolment-date-year'])
      errors.push({id:'enrolment-date-day', msg:'Enter your date of enrolment'});
    if (!D['term-from-day'] || !D['term-from-month'] || !D['term-from-year'])
      errors.push({id:'term-from-day', msg:'Enter the current term start date'});
    if (!D['term-to-day'] || !D['term-to-month'] || !D['term-to-year'])
      errors.push({id:'term-to-day', msg:'Enter the current term end date'});
  }

  if (pageId === 'declaration') {
    if (!D['declaration-agree']) errors.push({id:'declaration-agree', msg:'Declaration – You must confirm the declaration to continue'});
  }

  return errors;
}

GovBB.init({
  formName: FORM_NAME,
  flow: FLOW,
  pages: PAGES,
  validate: validate
});

</script>
</body>
</html>
