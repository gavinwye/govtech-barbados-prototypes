<!-- Alpha banner -->

  </div>

<!-- Main -->
<main>
  <div class="container py-l max-w-3xl" id="app"></div>

<!-- Footer -->
<footer class="bg-bb-blue-100 text-bb-white-00">
  <div class="container py-l text-[1rem]">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <p>&copy; 2024 Government of Barbados. All rights reserved.</p>
      <div class="flex gap-4">
        <a href="#" class="underline underline-offset-2 hover:no-underline text-bb-white-00">Privacy</a>
        <a href="#" class="underline underline-offset-2 hover:no-underline text-bb-white-00">Terms</a>
        <a href="#" class="underline underline-offset-2 hover:no-underline text-bb-white-00">Accessibility</a>
      </div>
    </div>
  </div>
</footer>

<script src="../assets/govbb-framework.js"></script>
<script>
const FORM_NAME = 'NIS Life Certificate';

const FLOW = ['start','personal-details','benefit-type','witness-details','declaration','check','confirmation'];

const PAGES = {
  'start': () => `
    <div class="space-y-8">
      <h1 class="font-bold text-[3.5rem] leading-[1.15]">${FORM_NAME}</h1>
      <p class="text-[1.25rem]">Use this form to confirm you are alive and still eligible for your NIS benefit. You need to complete this form regularly to keep receiving your payments.</p>
      <div class="space-y-4">
        <h2 class="font-bold text-[1.5rem]">What you will need</h2>
        <ul class="list-disc pl-6 space-y-2 text-[1.25rem]">
          <li>Your National Insurance Number</li>
          <li>Your National Registration Number</li>
          <li>Details of a witness (Justice of the Peace, Notary Public, or similar authority)</li>
        </ul>
      </div>
      <p class="text-[1.25rem] text-bb-mid-grey-00">It should take about 5 minutes to complete this form.</p>
      ${GovBB.startBtn()}
    </div>`,

  'personal-details': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Your personal details</h1>
      <div class="space-y-8">
        ${GovBB.textField('nis-number','National Insurance Number',{hint:'This is a 6-digit number. You can find it on your NIS card or payslip.',inputmode:'numeric',maxlength:'6'})}
        ${GovBB.textField('nrn','National Registration Number',{hint:'Find this on your National ID card. Format: YYMMDD-XXXX',placeholder:'870315-1234'})}
        ${GovBB.textField('first-name','First name')}
        ${GovBB.textField('middle-name','Middle name(s)',{hint:'Optional. Include all middle names.'})}
        ${GovBB.textField('last-name','Last name')}
        ${GovBB.dateField('dob','Date of birth','For example, 27 03 1950')}
        ${GovBB.textField('address','Street address')}
        ${GovBB.textField('district','District',{hint:'Village or district name. For example, Brittons Hill.'})}
        ${GovBB.selectField('parish','Parish',GovBB.PARISHES)}
        ${GovBB.textField('postal-code','Postal code',{hint:'For example, BB11000',placeholder:'BB11000',width:'12rem'})}
        ${GovBB.emailField('email','Email address',{hint:'We will use this to contact you about your certificate.'})}
        ${GovBB.telField('tel','Landline number',{hint:'For example, 246-555-1234. You must give at least one phone number.',placeholder:'246-555-1234'})}
        ${GovBB.telField('cell','Mobile number',{hint:'For example, 246-555-6789',placeholder:'246-555-6789'})}
        ${GovBB.continueBtn()}
      </div>
    </form>`,

  'benefit-type': () => {
    const benefitType = GovBB.D['benefit-type'] || '';
    const remarried = GovBB.D['remarried'] || '';
    const isSurvivors = benefitType === "Survivors' or Death Benefit";
    const isRemarriedYes = remarried === 'Yes';

    const survivorsFields = isSurvivors ? `
      <div class="space-y-8 mt-4 p-4 bg-bb-blue-10 rounded-sm">
        ${GovBB.radioGroup('remarried','Have you remarried since the death of the insured person?',['Yes','No'])}
        ${isRemarriedYes ? `<div class="mt-4">${GovBB.dateField('remarried-date','Date of remarriage','For example, 15 06 2020')}</div>` : ''}
      </div>` : '';

    return `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Which benefit do you receive?</h1>
      <div class="space-y-8">
        ${GovBB.radioGroup('benefit-type','Select the type of NIS benefit you are claiming',['Old Age Contributory Pension',"Survivors' or Death Benefit",'Disablement Benefit'])}
        ${survivorsFields}
        ${GovBB.continueBtn()}
      </div>
    </form>`;
  },

  'witness-details': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Witness details</h1>
      <p class="text-[1.25rem] mb-8">A witness must confirm that they have seen you alive. The witness should be a Justice of the Peace, Notary Public, or similar authority.</p>
      <div class="space-y-8">
        ${GovBB.dateField('alive-date','Date the witness confirmed you are alive','For example, 10 04 2026')}
        ${GovBB.textField('witness-name','Full name of witness')}
        ${GovBB.textField('witness-profession','Witness profession or title',{hint:'For example, Justice of the Peace, Notary Public, Police Officer'})}
        ${GovBB.dateField('witness-date','Date the witness signed','For example, 10 04 2026')}
        ${GovBB.continueBtn()}
      </div>
    </form>`,

  'declaration': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Declaration</h1>
      <div class="space-y-8">
        <div class="space-y-2 mb-6">
          <p class="text-[1.25rem]"><span class="font-bold">Claimant's name:</span> ${[GovBB.D['first-name'], GovBB.D['middle-name'], GovBB.D['last-name']].filter(Boolean).join(' ') || '\u2014'}</p>
          <p class="text-[1.25rem]"><span class="font-bold">Date:</span> ${(function(){ var d=new Date(); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); })()}</p>
        </div>
        <p class="text-[1.25rem]">I declare that the information I have given is true and complete to the best of my knowledge. I understand that giving false information may result in the suspension of my benefit.</p>
        ${GovBB.checkboxItem('declaration-agree', 'I confirm that the information I have given is true and complete.')}
        <div class="mt-8 flex gap-4">
          <button type="button" onclick="back()" class="relative inline-flex items-center justify-center gap-2 text-[20px] whitespace-nowrap transition-colors duration-200 outline-none bg-bb-grey-00 text-bb-black-00 hover:bg-[#c5ccd4] px-xm py-s rounded-sm leading-[1.7] focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-offset-1 focus-visible:ring-bb-teal-100">Back</button>
          <button type="button" onclick="next()" class="relative inline-flex items-center justify-center gap-2 text-[20px] whitespace-nowrap transition-[background-color,box-shadow] duration-200 outline-none bg-bb-teal-00 text-bb-white-00 hover:bg-[#1a777d] hover:shadow-[inset_0_0_0_4px_rgba(222,245,246,0.10)] active:bg-[#0a4549] active:shadow-[inset_0_0_0_3px_rgba(0,0,0,0.20)] px-xm py-s rounded-sm leading-[1.7] focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-offset-1 focus-visible:ring-bb-teal-100">Submit certificate</button>
        </div>
      </div>
    </form>`,

  'check': () => {
    const D = GovBB.D;
    const isSurvivors = D['benefit-type'] === "Survivors' or Death Benefit";
    const survivorsRows = isSurvivors ? `
          ${GovBB.summaryRow('Have you remarried?', D['remarried'], 'benefit-type')}
          ${D['remarried'] === 'Yes' ? GovBB.summaryRow('Date of remarriage', [D['remarried-date-day'],D['remarried-date-month'],D['remarried-date-year']].filter(Boolean).join(' / '), 'benefit-type') : ''}` : '';

    return `
    <div>
      ${GovBB.backLink()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Check your answers before sending your certificate</h1>
      <div class="space-y-8">
        <h2 class="font-bold text-[1.5rem]">Personal details</h2>
        <dl>
          ${GovBB.summaryRow('National Insurance Number', D['nis-number'], 'personal-details')}
          ${GovBB.summaryRow('National Registration Number', D['nrn'], 'personal-details')}
          ${GovBB.summaryRow('First name', D['first-name'], 'personal-details')}
          ${GovBB.summaryRow('Middle name(s)', D['middle-name'], 'personal-details')}
          ${GovBB.summaryRow('Last name', D['last-name'], 'personal-details')}
          ${GovBB.summaryRow('Date of birth', [D['dob-day'],D['dob-month'],D['dob-year']].filter(Boolean).join(' / '), 'personal-details')}
        </dl>
        <h2 class="font-bold text-[1.5rem]">Address and contact</h2>
        <dl>
          ${GovBB.summaryRow('Street address', D['address'], 'personal-details')}
          ${GovBB.summaryRow('District', D['district'], 'personal-details')}
          ${GovBB.summaryRow('Parish', D['parish'], 'personal-details')}
          ${GovBB.summaryRow('Postal code', D['postal-code'], 'personal-details')}
          ${GovBB.summaryRow('Email address', D['email'], 'personal-details')}
          ${GovBB.summaryRow('Landline number', D['tel'], 'personal-details')}
          ${GovBB.summaryRow('Mobile number', D['cell'], 'personal-details')}
        </dl>
        <h2 class="font-bold text-[1.5rem]">Benefit details</h2>
        <dl>
          ${GovBB.summaryRow('Benefit type', D['benefit-type'], 'benefit-type')}
          ${survivorsRows}
        </dl>
        <h2 class="font-bold text-[1.5rem]">Witness details</h2>
        <dl>
          ${GovBB.summaryRow('Date confirmed alive', [D['alive-date-day'],D['alive-date-month'],D['alive-date-year']].filter(Boolean).join(' / '), 'witness-details')}
          ${GovBB.summaryRow('Witness name', D['witness-name'], 'witness-details')}
          ${GovBB.summaryRow('Witness profession', D['witness-profession'], 'witness-details')}
          ${GovBB.summaryRow('Witness signed date', [D['witness-date-day'],D['witness-date-month'],D['witness-date-year']].filter(Boolean).join(' / '), 'witness-details')}
        </dl>
        ${GovBB.continueBtn('Submit certificate')}
      </div>
    </div>`;
  },

  'confirmation': () => `
    <div class="space-y-8">
      <div class="confirmation-panel">
        <h1 class="font-bold text-[2rem] leading-[1.15] mb-4">Certificate submitted</h1>
        <p class="text-[1.25rem]">Your reference number</p>
        <p class="text-[2rem] font-bold">${window.__refNumber || 'LC-' + Math.random().toString(36).substring(2,8).toUpperCase()}</p>
      </div>
      <h2 class="font-bold text-[1.5rem]">What happens next</h2>
      <p class="text-[1.25rem]">NIS will verify your certificate and continue your benefit payments.</p>
      <p class="text-[1.25rem]">If there is a problem with your certificate, NIS will contact you using the details you gave.</p>
      <h2 class="font-bold text-[1.5rem]">Contact NIS</h2>
      <p class="text-[1.25rem]">Phone: (246) 431-7400 or (246) 467-4647</p>
      <p class="text-[1.25rem]">Email: customer.service@bginis.gov.bb</p>
      <p class="text-[1.25rem]">Address: Frank Walcott Building, Culloden Road, St. Michael, Barbados</p>
    </div>`
};

function validate(pageId) {
  const D = GovBB.D;
  const errors = [];

  if (pageId === 'personal-details') {
    if (!D['nis-number']) errors.push({id:'nis-number', msg:'Enter your National Insurance Number'});
    else if (!/^\d{6}$/.test(D['nis-number'])) errors.push({id:'nis-number', msg:'National Insurance Number must be 6 digits'});
    if (!D['nrn']) errors.push({id:'nrn', msg:'Enter your National Registration Number'});
    else if (!/^\d{6}-\d{4}$/.test(D['nrn'])) errors.push({id:'nrn', msg:'National Registration Number must be in the format YYMMDD-XXXX, for example 870315-1234'});
    if (!D['first-name']) errors.push({id:'first-name', msg:'Enter your first name'});
    if (!D['last-name']) errors.push({id:'last-name', msg:'Enter your last name'});
    if (!D['dob-day'] || !D['dob-month'] || !D['dob-year']) errors.push({id:'dob-day', msg:'Date of birth \u2013 Enter your date of birth'});
    if (!D['address']) errors.push({id:'address', msg:'Enter your street address'});
    if (!D['parish']) errors.push({id:'parish', msg:'Select your parish'});
    if (!D['postal-code']) errors.push({id:'postal-code', msg:'Enter your postal code'});
    else if (!/^BB\d{5}$/.test(D['postal-code'])) errors.push({id:'postal-code', msg:'Postal code must be BB followed by 5 digits, for example BB11000'});
    if (!D['email']) errors.push({id:'email', msg:'Enter your email address'});
    if (!D['tel'] && !D['cell']) errors.push({id:'tel', msg:'Enter at least one phone number (landline or mobile)'});
  }

  if (pageId === 'benefit-type') {
    if (!D['benefit-type']) errors.push({id:'benefit-type', msg:'Select the type of benefit you receive'});
    if (D['benefit-type'] === "Survivors' or Death Benefit") {
      if (!D['remarried']) errors.push({id:'remarried', msg:'Tell us if you have remarried'});
      if (D['remarried'] === 'Yes') {
        if (!D['remarried-date-day'] || !D['remarried-date-month'] || !D['remarried-date-year'])
          errors.push({id:'remarried-date-day', msg:'Date of remarriage \u2013 Enter the date you remarried'});
      }
    }
  }

  if (pageId === 'witness-details') {
    if (!D['alive-date-day'] || !D['alive-date-month'] || !D['alive-date-year'])
      errors.push({id:'alive-date-day', msg:'Date confirmed alive \u2013 Enter the date the witness confirmed you are alive'});
    if (!D['witness-name']) errors.push({id:'witness-name', msg:'Enter the full name of the witness'});
    if (!D['witness-profession']) errors.push({id:'witness-profession', msg:'Enter the witness profession or title'});
    if (!D['witness-date-day'] || !D['witness-date-month'] || !D['witness-date-year'])
      errors.push({id:'witness-date-day', msg:'Witness signed date \u2013 Enter the date the witness signed'});
  }

  if (pageId === 'declaration') {
    if (!D['declaration-agree']) errors.push({id:'declaration-agree', msg:'Declaration \u2013 You must confirm the declaration to continue'});
  }

  return errors;
}

GovBB.init({
  formName: FORM_NAME,
  flow: FLOW,
  pages: PAGES,
  validate: validate,
  onRadioChange: function(name, value) {
    if (name === 'benefit-type' || name === 'remarried') {
      GovBB.render();
    }
  }
});

</script>
</body>
</html>
